<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>발표 채점 - 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#07070d;color:#e4e4ee;min-height:100dvh;overflow-x:hidden}input,button,select,textarea{font-family:inherit}input::placeholder{color:#999}input:focus{outline:none;border-color:#635bff!important;box-shadow:0 0 0 3px rgba(99,91,255,0.15)}button{cursor:pointer;border:none;background:none}button:disabled{cursor:not-allowed;opacity:0.45}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a2a40;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes scaleIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}@keyframes slideLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.fade-in{animation:fadeIn .4s ease-out both}.scale-in{animation:scaleIn .3s ease-out both}.slide-up{animation:slideUp .5s ease-out both}.slide-left{animation:slideLeft .35s ease-out both}
.container{max-width:640px;margin:0 auto;padding:16px 20px 40px}.container-wide{max-width:900px;margin:0 auto;padding:16px 20px 40px}.card{background:#0f0f18;border:1px solid #1e1e30;border-radius:16px;padding:20px;margin-bottom:12px}.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}.badge-live{background:rgba(239,68,68,0.15);color:#ef4444;animation:livePulse 2s ease-in-out infinite}.badge-success{background:rgba(16,185,129,0.12);color:#10b981}.badge-primary{background:rgba(99,91,255,0.12);color:#8b85ff}.badge-weight{background:rgba(245,158,11,0.12);color:#f59e0b;font-family:'JetBrains Mono',monospace}.badge-staff{background:rgba(168,85,247,0.15);color:#a855f7}
.btn{padding:11px 22px;border-radius:10px;font-weight:600;font-size:14px;transition:all .2s;border:1px solid transparent}.btn-primary{background:#635bff;border-color:#4840cc;color:#fff}.btn-outline{background:transparent;border-color:#2a2a40;color:#e4e4ee}.btn-danger{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.3);color:#ef4444}.btn-success{background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.3);color:#10b981}.btn-ghost{background:transparent;color:#9898b4}.btn-lg{padding:15px 30px;font-size:16px;border-radius:12px}.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px}.btn-block{width:100%}
.mono{font-family:'JetBrains Mono',monospace}.input{width:100%;background:#fff;border:1px solid #ccd;border-radius:8px;padding:10px 14px;color:#111;font-size:15px}.screen{display:none}.screen.active{display:block}.fc{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}.bg{background:radial-gradient(ellipse at 50% 0%,#111128 0%,#07070d 60%)}.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}.dot{width:8px;height:8px;border-radius:50%;background:#1e1e30;transition:all .3s;cursor:pointer}.dot.active{background:#635bff;width:24px;border-radius:4px}.dot.done{background:#10b981}.chart-bar{transform-origin:left;animation:growBar 0.8s ease-out both;border-radius:0 6px 6px 0;height:100%}.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;animation:countUp 0.5s ease-out both}.live-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;animation:pulse 1.5s ease infinite}.status-chip{padding:4px 8px;border-radius:6px;font-size:11px;text-align:center;font-weight:500}
</style>
</head>
<body>
<div id="s-home" class="screen active fc bg"><div style="text-align:center;max-width:420px;width:100%"><div class="scale-in" style="width:80px;height:80px;border-radius:24px;background:rgba(99,91,255,0.12);border:1px solid rgba(99,91,255,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px">👑</div><h1 class="fade-in" style="font-size:28px;font-weight:900;margin-bottom:32px">관리자 모드</h1><div style="display:flex;flex-direction:column;gap:14px"><button onclick="goSetup()" class="slide-up" style="background:linear-gradient(135deg,#635bff,#4840cc);border:none;border-radius:16px;padding:22px 24px;color:#fff;font-size:17px;font-weight:700;text-align:left;display:flex;align-items:center;gap:16px;box-shadow:0 8px 32px rgba(99,91,255,0.3)"><span style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:22px">🚀</span><div><div>세션 생성</div><div style="font-size:12px;font-weight:400;opacity:.75;margin-top:3px">조 구성 · 발표 진행 · 결과</div></div></button><button onclick="openLiveP()" class="slide-up" style="background:#0f0f18;border:1px solid rgba(239,68,68,0.2);border-radius:16px;padding:18px 24px;color:#e4e4ee;font-size:15px;font-weight:700;text-align:left;display:flex;align-items:center;gap:16px"><span style="width:48px;height:48px;border-radius:14px;background:rgba(239,68,68,0.08);display:flex;align-items:center;justify-content:center;font-size:22px">📺</span><div><div>실시간 스코어보드</div><div style="font-size:12px;color:#888;margin-top:3px">프로젝터용</div></div></button><button onclick="resumeS()" class="slide-up" style="background:#0f0f18;border:1px solid #1e1e30;border-radius:16px;padding:18px 24px;color:#e4e4ee;font-size:15px;font-weight:700;text-align:left;display:flex;align-items:center;gap:16px"><span style="width:48px;height:48px;border-radius:14px;background:#12121c;display:flex;align-items:center;justify-content:center;font-size:22px">🔄</span><div><div>기존 세션 이어가기</div><div style="font-size:12px;color:#888;margin-top:3px">세션 코드 입력 후 관리</div></div></button></div></div></div>
<div id="s-setup" class="screen"><div class="container"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><button class="btn btn-ghost btn-sm" onclick="setupBack()">← 이전</button><span id="st-t" style="font-size:16px;font-weight:700"></span><span id="st-s" class="mono" style="font-size:12px;color:#888"></span></div><div id="st-d" class="dots"></div><div id="st-b"></div></div></div>
<div id="s-admin" class="screen"><div class="container"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px"><div><h1 style="font-size:22px;font-weight:800">👑 관리자</h1><p id="a-sid" style="color:#888;font-size:13px;margin-top:4px"></p></div><div style="display:flex;gap:6px"><button class="btn btn-outline btn-sm" id="btn-tog" onclick="togV()">📊 결과</button><button class="btn btn-danger btn-sm" onclick="delS()">삭제</button></div></div><div id="share" style="background:rgba(99,91,255,0.12);border:1px solid rgba(99,91,255,0.15);border-radius:12px;padding:12px 16px;margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="color:#9898b4;font-size:11px;margin-bottom:4px">참가자에게 공유</div><div id="sh-url" class="mono" style="color:#8b85ff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div><button class="btn btn-primary btn-sm" onclick="cpLink()" id="btn-cp">복사</button></div><div style="margin-top:8px;padding:8px 12px;background:#0f0f18;border-radius:8px;display:flex;align-items:center;gap:8px">📱 <span style="color:#9898b4;font-size:12px">코드: <strong id="a-code" class="mono" style="color:#e4e4ee;letter-spacing:2px"></strong></span></div></div><div id="a-body"></div><div id="a-btns" style="margin-top:12px;display:flex;flex-direction:column;gap:8px"></div></div></div>
<div id="s-det" class="screen"><div class="container"><div style="display:flex;align-items:center;gap:8px;margin-bottom:20px"><button class="btn btn-ghost btn-sm" onclick="show('s-admin')">← 돌아가기</button><h2 id="d-t" style="font-size:18px;font-weight:800"></h2></div><div id="d-b"></div></div></div>
<div id="s-live" class="screen"><div class="container-wide" style="padding-top:30px"><div id="l-h" style="text-align:center;margin-bottom:24px"></div><div id="l-b"></div></div></div>
<div id="s-res" class="screen"><div class="container-wide" style="padding-top:40px;padding-bottom:60px"><div class="scale-in" style="text-align:center;margin-bottom:40px"><div style="font-size:56px;margin-bottom:12px">🏆</div><h1 style="font-size:36px;font-weight:900;margin-bottom:8px">최종 결과</h1><p id="r-sub" style="color:#888"></p></div><div id="r-b"></div><div style="text-align:center;margin-top:32px"><button class="btn btn-ghost" onclick="show('s-home')">홈으로</button></div></div></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'
import{getDatabase,ref,set,get,onValue,remove}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js'
const app=initializeApp({apiKey:"AIzaSyCTOXhHZLGRbzdUnMc1grQi711uaXSLA6k",authDomain:"presentation-score-65753.firebaseapp.com",databaseURL:"https://presentation-score-65753-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"presentation-score-65753",storageBucket:"presentation-score-65753.firebasestorage.app",messagingSenderId:"904312501135",appId:"1:904312501135:web:db03173baa400af63f91fa"})
const db=getDatabase(app),FB={ref,set,get,onValue,remove}

const CATS=[
  {id:'c1',label:'교육효과',emoji:'🎓',max:30},
  {id:'c2',label:'분야 적합성',emoji:'🎯',max:20},
  {id:'c3',label:'문제해결 논리성',emoji:'🧩',max:20},
  {id:'c4',label:'접근의 다양성',emoji:'🔍',max:20},
  {id:'c5',label:'실현가능성',emoji:'⚙️',max:10},
]
const MC=['#fbbf24','#94a3b8','#d97706'],BC=['#635bff','#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#14b8a6']
function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r}
// 점수 계산: 저장값이 이미 배점 기준이므로 그냥 합산
function calc(sc,gid){const gs=sc?.[gid];if(!gs||typeof gs!=='object')return null;const S=Object.keys(gs);if(!S.length)return null;const avg={};CATS.forEach(c=>{const v=[];S.forEach(s=>{const o=gs[s];if(o&&typeof o[c.id]==='number')v.push(o[c.id])});avg[c.id]=v.length?v.reduce((a,b)=>a+b,0)/v.length:0});const t=CATS.reduce((s,c)=>s+avg[c.id],0);return{avg,total:t,count:S.length}}
function ranked(cfg,sc){if(!cfg)return[];return cfg.groups.filter(g=>!g.isStaff).map(g=>({...g,r:calc(sc,g.id)})).filter(g=>g.r).sort((a,b)=>b.r.total-a.r.total)}
function findG(cfg,n){for(const g of cfg.groups)if(g.members?.includes(n))return g;return null}

let T={sid:null,cfg:null,sc:{},on:{},gc:2,groups:[],staff:['',''],ss:0,sr:false,unsub:null,unsub2:null}
function reset(){if(T.unsub)T.unsub();if(T.unsub2)T.unsub2();T={sid:null,cfg:null,sc:{},on:{},gc:2,groups:[],staff:['',''],ss:0,sr:false,unsub:null,unsub2:null}}

window.goSetup=function(){reset();T.ss=0;show('s-setup');renderSetup()}
window.openLiveP=function(){const c=prompt('세션 코드:');if(c?.trim()){reset();T.sid=c.trim().toUpperCase();loadLive()}}
window.resumeS=function(){const c=prompt('기존 세션 코드:');if(c?.trim()){T.sid=c.trim().toUpperCase();loadAdmin()}}

function renderSetup(){const s=T.ss,tot=T.gc+3;$('st-s').textContent=`${s+1}/${tot}`;let d='';for(let i=0;i<tot;i++)d+=`<div class="dot ${i===s?'active':i<s?'done':''}"></div>`;$('st-d').innerHTML=d;const b=$('st-b')
  if(s===0){$('st-t').textContent='⚙️ 세션 설정';b.innerHTML=`<div class="card slide-left"><h2 style="font-size:16px;font-weight:700;margin-bottom:12px">세션 코드</h2><p style="color:#888;font-size:12px;margin-bottom:10px">비워두면 자동 생성</p><input class="input mono" id="ic" placeholder="예: NANO2026 또는 발표대회" maxlength="20" value="${T.cc||''}" style="letter-spacing:1px;text-align:center;margin-bottom:20px"><h2 style="font-size:16px;font-weight:700;margin-bottom:16px">조 수</h2><div id="gg" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px"></div><button class="btn btn-primary btn-lg btn-block" onclick="sN()">다음 →</button></div>`;const g=$('gg');for(let n=2;n<=10;n++){const x=document.createElement('button');x.textContent=n;x.style.cssText=`aspect-ratio:1;border-radius:12px;font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;border:2px solid ${n===T.gc?'#635bff':'#1e1e30'};background:${n===T.gc?'rgba(99,91,255,0.12)':'#12121c'};color:${n===T.gc?'#8b85ff':'#9898b4'}`;x.onclick=()=>{T.gc=n;renderSetup()};g.appendChild(x)};return}
  const gi=s-1
  if(gi>=0&&gi<T.gc){while(T.groups.length<T.gc)T.groups.push({id:'g'+(T.groups.length+1),name:(T.groups.length+1)+'조',members:['','']});const g=T.groups[gi];$('st-t').textContent=`${g.name} 조원`;let h=`<div class="card slide-left"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-size:18px;font-weight:800">${g.name} <span class="mono" style="color:#888;font-size:13px">${g.members.filter(m=>m.trim()).length}명</span></h2><button class="btn btn-ghost btn-sm" onclick="wA(${gi})">+ 추가</button></div><div style="display:flex;flex-direction:column;gap:8px">`;g.members.forEach((m,mi)=>{h+=`<div style="display:flex;gap:6px"><input class="input" value="${m}" oninput="wU(${gi},${mi},this.value)" placeholder="조원 ${mi+1}">${g.members.length>1?`<button style="color:#888;font-size:20px;padding:0 8px" onclick="wR(${gi},${mi})">×</button>`:''}</div>`});h+=`</div><div style="display:flex;gap:8px;margin-top:20px"><button class="btn btn-outline" onclick="setupBack()" style="flex:1">←</button><button class="btn btn-primary" onclick="sN()" style="flex:2">다음 →</button></div></div>`;b.innerHTML=h;return}
  if(gi===T.gc){$('st-t').textContent='👥 Staff';let h=`<div class="card slide-left" style="border-color:rgba(168,85,247,0.3)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="font-size:18px;font-weight:800"><span class="badge badge-staff">STAFF</span></h2><button class="btn btn-ghost btn-sm" onclick="sAd()">+ 추가</button></div><p style="color:#888;font-size:12px;margin-bottom:14px">모든 조 채점 가능, 순위 제외</p><div style="display:flex;flex-direction:column;gap:8px">`;T.staff.forEach((m,i)=>{h+=`<div style="display:flex;gap:6px"><input class="input" value="${m}" oninput="sUp(${i},this.value)" placeholder="스태프 ${i+1}" style="border-color:rgba(168,85,247,0.2)">${T.staff.length>1?`<button style="color:#888;font-size:20px;padding:0 8px" onclick="sRm(${i})">×</button>`:''}</div>`});h+=`</div><div style="display:flex;gap:8px;margin-top:20px"><button class="btn btn-outline" onclick="setupBack()" style="flex:1">←</button><button class="btn btn-primary" onclick="sN()" style="flex:2">다음 →</button></div></div>`;b.innerHTML=h;return}
  $('st-t').textContent='✅ 확인';const tm=T.groups.reduce((a,g)=>a+g.members.filter(m=>m.trim()).length,0),sc=T.staff.filter(m=>m.trim()).length;let h=`<div class="card slide-left">`;T.groups.slice(0,T.gc).forEach(g=>{const m=g.members.filter(x=>x.trim());h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px 14px;background:#12121c;border-radius:10px"><span style="font-weight:700;width:40px">${g.name}</span><span style="color:#9898b4;font-size:13px;flex:1">${m.join(', ')}</span><span class="mono" style="font-size:12px;color:#888">${m.length}명</span></div>`});if(sc>0)h+=`<div style="padding:10px 14px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.15);border-radius:10px;margin-bottom:8px"><span class="badge badge-staff">STAFF</span> <span style="color:#9898b4;font-size:13px">${T.staff.filter(m=>m.trim()).join(', ')}</span></div>`;h+=`<div style="background:rgba(99,91,255,0.08);border-radius:10px;padding:12px;text-align:center;margin:12px 0"><span style="color:#8b85ff;font-weight:600">${T.gc}개 조 · ${tm}명${sc?' + Staff '+sc+'명':''}</span></div><div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="setupBack()" style="flex:1">←</button><button class="btn btn-primary btn-lg" onclick="createS()" id="btn-cr" style="flex:2">🚀 생성</button></div></div>`;b.innerHTML=h}
window.sN=function(){if(T.ss===0){T.cc=$('ic')?.value?.trim()||'';while(T.groups.length<T.gc)T.groups.push({id:'g'+(T.groups.length+1),name:(T.groups.length+1)+'조',members:['','']});if(T.groups.length>T.gc)T.groups.length=T.gc};T.ss++;renderSetup()}
window.setupBack=function(){if(T.ss<=0){show('s-home');return};T.ss--;renderSetup()}
window.wA=function(gi){T.groups[gi].members.push('');renderSetup()};window.wR=function(gi,mi){if(T.groups[gi].members.length<=1)return;T.groups[gi].members.splice(mi,1);renderSetup()};window.wU=function(gi,mi,v){T.groups[gi].members[mi]=v}
window.sAd=function(){T.staff.push('');renderSetup()};window.sRm=function(i){if(T.staff.length<=1)return;T.staff.splice(i,1);renderSetup()};window.sUp=function(i,v){T.staff[i]=v}
window.createS=async function(){const btn=$('btn-cr');btn.disabled=true;btn.textContent='생성 중...';try{let sid=T.cc;if(sid)sid=sid.replace(/[.#$\[\]\/]/g,'');if(!sid)sid=genCode();const ex=await FB.get(FB.ref(db,`sessions/${sid}`));if(ex.val()){alert(`"${sid}" 사용 중`);btn.disabled=false;btn.textContent='🚀 생성';return};const cl=T.groups.slice(0,T.gc).map(g=>({...g,members:g.members.filter(m=>m.trim()),isStaff:false}));const st=T.staff.filter(m=>m.trim());if(st.length>0)cl.push({id:'staff',name:'Staff',members:st,isStaff:true});await FB.set(FB.ref(db,`sessions/${sid}`),{config:{groups:cl,currentGroup:-1,finished:false},scores:{},online:{}});T.sid=sid;loadAdmin()}catch(e){alert('실패');btn.disabled=false;btn.textContent='🚀 생성'}}

function loadAdmin(){show('s-admin');$('a-sid').textContent=`세션: ${T.sid}`;$('a-code').textContent=T.sid;const base=location.href.split('/').slice(0,-1).join('/')+'/';$('sh-url').textContent=`${base}index.html → 코드: ${T.sid}`;if(T.unsub)T.unsub();T.unsub=FB.onValue(FB.ref(db,`sessions/${T.sid}`),(snap)=>{const d=snap.val();if(!d){show('s-home');return};T.cfg=d.config;T.sc=d.scores||{};T.on=d.online||{};renderAdmin()})}

function renderAdmin(){
  if(T.sr){renderRes2();return}
  let html='';const on=Object.keys(T.on)
  html+=`<div style="background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);border-radius:14px;padding:12px 16px;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px">👥 <span style="font-size:13px;font-weight:700;color:#10b981">접속</span><span class="mono badge badge-success" style="font-weight:800">${on.length}명</span></div>${on.length?'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">'+on.map(n=>`<span style="background:${T.on[n]?.isStaff?'rgba(168,85,247,0.12)':'#12121c'};border:1px solid ${T.on[n]?.isStaff?'rgba(168,85,247,0.25)':'#1e1e30'};border-radius:6px;padding:3px 8px;font-size:11px;color:${T.on[n]?.isStaff?'#a855f7':'#e4e4ee'}">${n}</span>`).join('')+'</div>':''}</div>`
  T.cfg.groups.filter(g=>!g.isStaff).forEach(group=>{const ri=T.cfg.groups.indexOf(group);const isCur=T.cfg.currentGroup===ri;const gs=T.sc[group.id]||{};const scored=Object.keys(gs);const res=calc(T.sc,group.id);const elig=on.filter(n=>{const g2=findG(T.cfg,n);if(!g2)return true;if(g2.isStaff)return true;return g2.id!==group.id});const done=elig.filter(n=>scored.includes(n)),pend=elig.filter(n=>!scored.includes(n))
    html+=`<div class="card" style="position:relative;overflow:hidden;${isCur?'background:linear-gradient(135deg,rgba(99,91,255,0.08),#0f0f18);border-color:rgba(99,91,255,0.35)':''}">${isCur?'<div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#635bff,#8b85ff)"></div>':''}<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:16px;font-weight:700;color:${isCur?'#8b85ff':'#e4e4ee'}">${group.name}</span>${isCur?'<span class="badge badge-live">● LIVE</span>':''}${scored.length?`<span class="badge badge-success">${scored.length}명</span>`:''}</div><div style="color:#888;font-size:12px;margin-top:4px">${group.members.join(' · ')}</div>${res?`<div class="mono" style="color:#8b85ff;font-size:14px;font-weight:700;margin-top:6px">${res.total.toFixed(1)}점 / 100</div>`:''}</div><div style="display:flex;gap:6px">${scored.length?`<button class="btn btn-outline btn-sm" onclick="showDet('${group.id}','${group.name}')">상세</button>`:''}${!isCur?`<button class="btn btn-primary btn-sm" onclick="startG(${ri})">${res?'재시작':'시작'}</button>`:''}</div></div>${isCur&&elig.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #1e1e30"><div style="font-size:11px;color:#888;margin-bottom:6px">채점 (${done.length}/${elig.length})</div><div style="display:flex;flex-wrap:wrap;gap:4px">${done.map(n=>`<span class="status-chip" style="background:rgba(16,185,129,0.15);color:#10b981">✓ ${n}</span>`).join('')}${pend.map(n=>`<span class="status-chip" style="background:rgba(245,158,11,0.1);color:#f59e0b">… ${n}</span>`).join('')}</div></div>`:''}</div>`})
  const rk=ranked(T.cfg,T.sc);if(rk.length){html+='<div style="margin-top:12px;padding:14px 16px;background:rgba(99,91,255,0.06);border:1px solid rgba(99,91,255,0.12);border-radius:14px"><div style="font-size:13px;font-weight:700;color:#8b85ff;margin-bottom:10px">📊 순위</div>';rk.forEach((g,i)=>{const mc=i<3?MC[i]:'#888';const bw=((g.r.total/(rk[0]?.r?.total||100))*100).toFixed(0);html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="mono" style="font-size:12px;font-weight:700;color:${mc};width:16px">${i+1}</span><span style="font-size:13px;font-weight:600;width:40px">${g.name}</span><div style="flex:1;height:8px;background:#12121c;border-radius:4px;overflow:hidden"><div style="height:100%;width:${bw}%;background:${BC[i%BC.length]};border-radius:4px;transition:width .5s"></div></div><span class="mono" style="font-size:12px;font-weight:700;color:${mc};width:45px;text-align:right">${g.r.total.toFixed(1)}</span></div>`});html+='</div>'}
  $('a-body').innerHTML=html
  $('a-btns').innerHTML=`<button class="btn btn-success btn-lg btn-block" onclick="finishAll()">🏆 전체 종료</button><button class="btn btn-primary btn-block" onclick="exportCSV()">💾 점수 저장 (CSV)</button><button class="btn btn-outline btn-block" onclick="openRes()">📊 전체 결과</button><button class="btn btn-outline btn-block" onclick="openLiveA()" style="border-color:rgba(239,68,68,0.2);color:#ef4444">📺 스코어보드 (새 탭)</button>`}

function renderRes2(){const rk=ranked(T.cfg,T.sc);let html='<h2 style="font-size:18px;font-weight:800;margin-bottom:16px">🏆 최종</h2>';if(!rk.length)html+='<p style="color:#888;text-align:center;padding:32px">없음</p>';else rk.forEach((g,i)=>{const mc=i<3?MC[i]:'#888';html+=`<div class="card" style="${i<3?`border-color:${mc}33`:''}"><div style="display:flex;align-items:center;gap:14px"><div class="mono" style="width:40px;height:40px;border-radius:50%;background:${mc}15;border:2px solid ${mc};display:flex;align-items:center;justify-content:center;font-weight:900;color:${mc}">${i+1}</div><div style="flex:1"><div style="font-weight:700">${g.name}</div><div style="color:#888;font-size:12px">${g.members.join(' · ')}</div></div><div><div class="mono" style="font-size:24px;font-weight:900;color:${mc}">${g.r.total.toFixed(1)}</div><button class="btn btn-ghost btn-sm" onclick="showDet('${g.id}','${g.name}')" style="font-size:11px">상세</button></div></div></div>`});$('a-body').innerHTML=html;$('a-btns').innerHTML=`<button class="btn btn-primary btn-block" onclick="exportCSV()">💾 CSV</button><button class="btn btn-outline btn-block" onclick="openRes()">📊 전체</button>`}

// 개별 상세: 저장값 그대로 표시 (이미 배점 기준)
window.showDet=function(gid,gn){show('s-det');$('d-t').textContent=`📋 ${gn} 개별 채점`;const gs=T.sc[gid]||{};const scorers=Object.keys(gs);if(!scorers.length){$('d-b').innerHTML='<p style="color:#888;text-align:center;padding:24px">데이터 없음</p>';return}
  let h=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:480px"><tr style="background:#12121c"><th style="padding:10px 8px;text-align:left;font-size:12px;color:#888;border-bottom:1px solid #1e1e30">채점자</th>`;CATS.forEach(c=>{h+=`<th style="padding:10px 6px;text-align:center;font-size:11px;color:#888;border-bottom:1px solid #1e1e30">${c.emoji} ${c.label}<br><span style="color:#f59e0b">/${c.max}</span></th>`});h+=`<th style="padding:10px 8px;text-align:center;font-size:12px;color:#8b85ff;font-weight:700;border-bottom:1px solid #1e1e30">/100</th></tr>`
  scorers.forEach(nm=>{const sc=gs[nm];if(!sc||typeof sc!=='object')return;const tot=CATS.reduce((s,c)=>s+(typeof sc[c.id]==='number'?sc[c.id]:0),0);const isSt=findG(T.cfg,nm)?.isStaff;h+=`<tr style="border-bottom:1px solid #1e1e30"><td style="padding:8px;font-weight:600;color:${isSt?'#a855f7':'#e4e4ee'}">${nm}${isSt?' ✦':''}</td>`;CATS.forEach(c=>{const v=sc[c.id];const ok=typeof v==='number';h+=`<td class="mono" style="padding:8px;text-align:center;font-size:14px;font-weight:700;color:${ok?'#e4e4ee':'#555'};background:${ok?`rgba(99,91,255,${(v/c.max*0.3).toFixed(2)})`:'transparent'}">${ok?v:'-'}</td>`});h+=`<td class="mono" style="padding:8px;text-align:center;font-size:15px;font-weight:900;color:#8b85ff">${tot}</td></tr>`})
  const avg=calc(T.sc,gid);if(avg){h+=`<tr style="background:#12121c"><td style="padding:10px 8px;font-weight:800;color:#8b85ff">평균</td>`;CATS.forEach(c=>{h+=`<td class="mono" style="padding:10px 6px;text-align:center;font-weight:800;color:#8b85ff">${avg.avg[c.id].toFixed(1)}</td>`});h+=`<td class="mono" style="padding:10px 8px;text-align:center;font-size:16px;font-weight:900;color:#fbbf24">${avg.total.toFixed(1)}</td></tr>`}
  h+='</table></div>';$('d-b').innerHTML=h}

window.startG=async function(i){await FB.set(FB.ref(db,`sessions/${T.sid}/config`),{...T.cfg,currentGroup:i,finished:false})}
window.finishAll=async function(){await FB.set(FB.ref(db,`sessions/${T.sid}/config`),{...T.cfg,finished:true,currentGroup:-1})}
window.togV=function(){T.sr=!T.sr;$('btn-tog').textContent=T.sr?'조 목록':'📊 결과';renderAdmin()}
window.delS=async function(){if(!confirm('삭제?'))return;await FB.remove(FB.ref(db,`sessions/${T.sid}`));show('s-home')}
window.cpLink=function(){const base=location.href.split('/').slice(0,-1).join('/')+'/';const msg=`발표 채점 링크: ${base}index.html\n세션 코드: ${T.sid}`;navigator.clipboard.writeText(msg).then(()=>{$('btn-cp').textContent='✓ 복사됨';setTimeout(()=>$('btn-cp').textContent='복사',2000)}).catch(()=>{prompt('복사:',msg)})}
window.openRes=function(){show('s-res');renderResults()}
window.openLiveA=function(){const b=location.href.split('/').slice(0,-1).join('/');window.open(`${b}/admin.html#live=${T.sid}`,'_blank')}

window.exportCSV=function(){const BOM='\uFEFF';let csv=BOM;const groups=T.cfg.groups.filter(g=>!g.isStaff);const ch=CATS.map(c=>`${c.label}(/${c.max})`)
  csv+='[ 종합 순위 ]\r\n순위,조,조원,'+ch.join(',')+',총점(/100),채점인원\r\n';const rk=ranked(T.cfg,T.sc);rk.forEach((g,i)=>{csv+=`${i+1},${g.name},"${g.members.join(', ')}",`;CATS.forEach(c=>{csv+=`${g.r.avg[c.id].toFixed(1)},`});csv+=`${g.r.total.toFixed(1)},${g.r.count}\r\n`})
  groups.forEach(group=>{csv+=`\r\n[ ${group.name} ]\r\n채점자,`+ch.join(',')+`,총점\r\n`;const gs=T.sc[group.id]||{};Object.keys(gs).forEach(nm=>{const sc=gs[nm];if(!sc||typeof sc!=='object')return;csv+=`${nm},`;CATS.forEach(c=>{const v=sc[c.id];csv+=`${typeof v==='number'?v:'-'},`});csv+=`${CATS.reduce((s,c)=>s+(typeof sc[c.id]==='number'?sc[c.id]:0),0)}\r\n`});const res=calc(T.sc,group.id);if(res){csv+=`평균,`;CATS.forEach(c=>{csv+=`${res.avg[c.id].toFixed(1)},`});csv+=`${res.total.toFixed(1)}\r\n`}})
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`채점결과_${T.sid}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url)}

function loadLive(){show('s-live');if(T.unsub2)T.unsub2();T.unsub2=FB.onValue(FB.ref(db,`sessions/${T.sid}`),(snap)=>{const d=snap.val();if(!d){$('l-b').innerHTML='<p style="text-align:center;color:#888;padding:40px">세션 없음</p>';return};T.cfg=d.config;T.sc=d.scores||{};T.on=d.online||{};renderLive()})}
function renderLive(){const rk=ranked(T.cfg,T.sc);const on=Object.keys(T.on).length;const cg=T.cfg.currentGroup>=0?T.cfg.groups[T.cfg.currentGroup]:null;$('l-h').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px"><span class="live-dot"></span><span style="font-size:14px;font-weight:700;color:#ef4444">LIVE</span><span style="color:#888">${T.sid}</span><span class="badge badge-success">${on}명</span></div>${cg?`<div style="font-size:24px;font-weight:900;color:#8b85ff">발표: ${cg.name}</div>`:T.cfg.finished?'<div style="font-size:20px;font-weight:700;color:#10b981">🏆 종료</div>':'<div style="color:#888">대기 중</div>'}`;if(!rk.length){$('l-b').innerHTML='<p style="text-align:center;color:#888;padding:40px">대기...</p>';return};let h='';const mx=rk[0]?.r?.total||100;rk.forEach((g,i)=>{const mc=i<3?MC[i]:BC[i%BC.length];const p=((g.r.total/mx)*100).toFixed(0);h+=`<div class="chart-row" style="animation-delay:${i*0.1}s;margin-bottom:12px"><div style="display:flex;align-items:center;gap:10px;width:80px"><span class="mono" style="font-size:20px;font-weight:900;color:${mc}">${i+1}</span><span style="font-size:15px;font-weight:700">${g.name}</span></div><div style="flex:1;height:36px;background:#12121c;border-radius:8px;overflow:hidden;position:relative"><div class="chart-bar" style="width:${p}%;background:linear-gradient(90deg,${mc}cc,${mc});animation-delay:${i*0.15}s"></div><span class="mono" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:800;color:#fff">${g.r.total.toFixed(1)}</span></div></div>`});$('l-b').innerHTML=h}

function renderResults(){const rk=ranked(T.cfg,T.sc);$('r-sub').textContent=`${T.sid} · ${rk.length}개 조 · 100점`;if(!rk.length){$('r-b').innerHTML='<p style="color:#888;text-align:center;padding:40px">없음</p>';return};let h='';if(rk.length>=3){h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:640px;margin:0 auto 40px">';[1,0,2].forEach(ri=>{const g=rk[ri];if(!g)return;const isF=ri===0;h+=`<div style="background:#0f0f18;border:1px solid ${MC[ri]}33;border-radius:18px;padding:24px 16px;text-align:center;${isF?'transform:scale(1.05)':''};order:${ri===1?0:ri===0?1:2}"><div style="font-size:${isF?48:36}px;margin-bottom:8px">${['🥇','🥈','🥉'][ri]}</div><div style="font-size:${isF?20:17}px;font-weight:800;margin-bottom:4px">${g.name}</div><div style="color:#888;font-size:11px;margin-bottom:12px">${g.members.join(' · ')}</div><div class="mono" style="font-size:${isF?32:26}px;font-weight:900;color:${MC[ri]}">${g.r.total.toFixed(1)}</div></div>`});h+='</div>'};h+=`<div class="card" style="padding:24px;margin-bottom:16px"><h3 style="font-weight:700;margin-bottom:20px">📊 종합</h3>`;const mx=rk[0]?.r?.total||100;rk.forEach((g,i)=>{const mc=i<3?MC[i]:BC[i%BC.length];h+=`<div class="chart-row" style="animation-delay:${i*0.12}s"><span style="font-size:13px;font-weight:700;width:50px;color:${mc}">${g.name}</span><div style="flex:1;height:28px;background:#12121c;border-radius:6px;overflow:hidden;position:relative"><div class="chart-bar" style="width:${((g.r.total/mx)*100).toFixed(0)}%;background:linear-gradient(90deg,${mc}cc,${mc})"></div><span class="mono" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:#fff">${g.r.total.toFixed(1)}</span></div></div>`});h+='</div>';h+=`<div class="card" style="padding:24px"><h3 style="font-weight:700;margin-bottom:16px">🎯 점수표</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:420px"><tr style="background:#12121c"><th style="padding:8px;text-align:left;font-size:11px;color:#888;border-bottom:1px solid #1e1e30">#</th><th style="padding:8px;text-align:left;font-size:11px;color:#888;border-bottom:1px solid #1e1e30">조</th>`;CATS.forEach(c=>{h+=`<th style="padding:8px;text-align:center;font-size:10px;color:#888;border-bottom:1px solid #1e1e30">${c.emoji}<br>/${c.max}</th>`});h+=`<th style="padding:8px;text-align:center;color:#8b85ff;font-weight:700;border-bottom:1px solid #1e1e30">/100</th></tr>`;rk.forEach((g,i)=>{const mc=i<3?MC[i]:'#e4e4ee';h+=`<tr style="border-bottom:1px solid #1e1e30"><td class="mono" style="padding:8px;text-align:center;font-weight:900;color:${mc}">${i+1}</td><td style="padding:8px;font-weight:600">${g.name}</td>`;CATS.forEach(c=>{const v=g.r.avg[c.id];h+=`<td class="mono" style="padding:8px;text-align:center;font-weight:700;background:rgba(99,91,255,${(v/c.max*0.3).toFixed(2)})">${v.toFixed(1)}</td>`});h+=`<td class="mono" style="padding:8px;text-align:center;font-size:16px;font-weight:900;color:${mc}">${g.r.total.toFixed(1)}</td></tr>`});h+='</table></div></div>';h+=`<button class="btn btn-primary btn-block" onclick="exportCSV()" style="margin-top:12px">💾 CSV</button>`;$('r-b').innerHTML=h}

const hash=location.hash.replace('#','');if(hash.startsWith('live=')){reset();T.sid=hash.split('=')[1].toUpperCase();loadLive()}
</script>
</body>
