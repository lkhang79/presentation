<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>실시간 발표 채점 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #06060c;
  --bg-card: #0d0d19;
  --border-color: #1e1e35;
  --primary: #635bff;
  --primary-glow: rgba(99,91,255,0.15);
  --text-main: #f1f1f7;
  --text-muted: #626285;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bonus: #ec4899;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
input, button, select { font-family: inherit; }
input::placeholder { color: var(--text-muted); }
input:focus { outline: none; border-color: var(--primary) !important; box-shadow: 0 0 0 3px var(--primary-glow); }
button { cursor: pointer; border: none; background: none; transition: all 0.2s ease; }
button:disabled { cursor: not-allowed; opacity: 0.4; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #25253d; border-radius: 3px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }

.fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
.container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
.container-wide { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

.card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 30px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge-live { background: rgba(239,68,68,0.12); color: var(--danger); animation: pulseGlow 2s infinite; }
.badge-success { background: rgba(16,185,129,0.12); color: var(--success); }
.badge-primary { background: rgba(99,91,255,0.12); color: #9c97ff; }
.badge-weight { background: #16162a; color: var(--warning); font-family: 'JetBrains Mono', monospace; border: 1px solid #252542; }
.badge-staff { background: rgba(168,85,247,0.15); color: #b975ff; }

.btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(99,91,255,0.3); }
.btn-primary:hover { background: #4f46e5; }
.btn-outline { background: #111122; border-color: var(--border-color); color: var(--text-main); }
.btn-outline:hover { background: #16162d; border-color: #333356; }
.btn-danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); color: var(--danger); }
.btn-success { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.2); color: var(--success); }
.btn-bonus { background: rgba(236,72,153,0.1); border-color: rgba(236,72,153,0.2); color: var(--bonus); }
.btn-block { width: 100%; display: flex; }

.mono { font-family: 'JetBrains Mono', monospace; }
.input { width: 100%; background: #07070f; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 14px; transition: border 0.15s; }
.screen { display: none; }
.screen.active { display: block; }
.fullscreen-center { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 50% 30%, #13122b 0%, var(--bg-main) 70%); }

.name-btn { width: 100%; background: #07070f; border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; color: var(--text-main); font-size: 14px; text-align: left; margin-bottom: 6px; }
.name-btn.selected { background: rgba(99,91,255,0.15) !important; border-color: var(--primary) !important; color: #9c97ff !important; font-weight: 700; }

.dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #222238; transition: all 0.25s; }
.dot.active { background: var(--primary); width: 20px; border-radius: 4px; }
.dot.done { background: var(--success); }

.chart-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.chart-container { flex: 1; height: 32px; background: #07070f; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid #151526; }
.chart-bar { height: 100%; transform-origin: left; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 0 4px 4px 0; }

.status-chip { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.status-chip.done { background: rgba(16,185,129,0.12); color: var(--success); }
.status-chip.pending { background: rgba(245,158,11,0.08); color: var(--warning); }

table { width: 100%; border-collapse: collapse; min-width: 600px; text-align: center; }
th, td { padding: 10px 8px; font-size: 13px; border-bottom: 1px solid var(--border-color); }
th { background: #07070f; color: var(--text-muted); font-weight: 600; font-size: 11px; }
</style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen fullscreen-center">
  <div style="text-align:center; max-width:360px; width:100%;" class="fade-in">
    <div style="width:72px; height:72px; border-radius:20px; background:rgba(99,91,255,0.1); border:1px solid rgba(99,91,255,0.2); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:32px">📊</div>
    <h1 style="font-size:28px; font-weight:900; letter-spacing:-0.5px; margin-bottom:6px">실시간 발표 채점</h1>
    <p style="color:var(--text-muted); font-size:14px; margin-bottom:36px">클라우드 통합 관리 플랫폼</p>
    <div style="display:flex; flex-direction:column; gap:12px">
      <button onclick="goSetup()" class="btn btn-primary btn-block" style="padding:16px;">👑 새로운 평가 세션 생성</button>
      <button onclick="openLivePrompt()" class="btn btn-outline btn-block" style="padding:14px;">📺 대형 스코어보드 열기</button>
    </div>
  </div>
</div>

<!-- SETUP -->
<div id="screen-setup" class="screen">
  <div class="container fade-in">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
      <button class="btn btn-outline mono" style="padding:6px 12px; font-size:12px;" onclick="setupBack()">← BACK</button>
      <span id="setup-title" style="font-size:15px; font-weight:700"></span>
      <span id="setup-step-label" class="mono" style="font-size:12px; color:var(--text-muted)"></span>
    </div>
    <div id="setup-dots" class="dots"></div>
    <div id="setup-content"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="screen-admin" class="screen">
  <div class="container fade-in">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px">
      <div>
        <h1 style="font-size:20px; font-weight:900">👑 세션 통제 패널</h1>
        <p id="admin-session-id" class="mono" style="color:var(--text-muted); font-size:12px; margin-top:2px"></p>
      </div>
      <div style="display:flex; gap:6px">
        <button class="btn btn-outline" style="padding:6px 12px; font-size:12px;" id="btn-toggle" onclick="toggleAdminView()">📊 결과전환</button>
        <button class="btn btn-danger" style="padding:6px 12px; font-size:12px;" onclick="resetSession()">삭제</button>
      </div>
    </div>
    
    <div id="share-bar" style="background:#0d0d19; border:1px solid var(--border-color); border-radius:12px; padding:12px 14px; margin-bottom:16px">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px">
        <div style="flex:1; min-width:0">
          <div style="color:var(--text-muted); font-size:11px; margin-bottom:2px">심사위원 접속 URL</div>
          <div id="share-url" class="mono" style="color:#9c97ff; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis"></div>
        </div>
        <button class="btn btn-primary" style="padding:6px 12px; font-size:12px;" onclick="copyLink()" id="btn-copy">복사</button>
      </div>
    </div>
    
    <div id="admin-body"></div>
    <div id="admin-buttons" style="margin-top:16px; display:flex; flex-direction:column; gap:8px"></div>
  </div>
</div>

<!-- JOIN -->
<div id="screen-join" class="screen fullscreen-center">
  <div style="max-width:380px; width:100%;" class="fade-in">
    <div style="text-align:center; margin-bottom:24px">
      <div style="font-size:36px; margin-bottom:4px">🎯</div>
      <h1 style="font-size:20px; font-weight:900">심사위원 등록</h1>
      <span class="badge badge-primary mono" id="join-badge" style="margin-top:6px"></span>
    </div>
    <div id="join-body"></div>
  </div>
</div>

<!-- VOTE CARD -->
<div id="screen-vote" class="screen">
  <div class="container fade-in">
    <div id="vote-banner"></div>
    <div id="vote-body"></div>
    <div style="text-align:center; margin-top:20px"><span id="vote-footer" class="mono" style="color:var(--text-muted); font-size:11px"></span></div>
  </div>
</div>

<!-- LIVE SCOREBOARD -->
<div id="screen-live" class="screen">
  <div class="container-wide fade-in">
    <div id="live-header" style="text-align:center; margin-bottom:24px"></div>
    <div id="live-body"></div>
  </div>
</div>

<!-- FINAL RESULTS -->
<div id="screen-results" class="screen">
  <div class="container-wide fade-in" style="padding-top:30px;">
    <div style="text-align:center; margin-bottom:32px">
      <div style="font-size:48px; margin-bottom:8px">🏆</div>
      <h1 style="font-size:32px; font-weight:900">최종 심사 결과</h1>
      <p id="results-sub" class="mono" style="color:var(--text-muted); font-size:13px; margin-top:4px"></p>
    </div>
    <div id="results-body"></div>
    <div style="text-align:center; margin-top:32px"><button class="btn btn-outline" onclick="goHome()">🏠 메인 화면으로</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'
import { getDatabase, ref, set, get, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js'

// [기존 설정 유지]
const firebaseConfig = {
  apiKey: "AIzaSyCTOXhHZLGRbzdUnMc1grQi711uaXSLA6k",
  authDomain: "presentation-score-65753.firebaseapp.com",
  databaseURL: "https://presentation-score-65753-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "presentation-score-65753",
  storageBucket: "presentation-score-65753.firebasestorage.app",
  messagingSenderId: "904312501135",
  appId: "1:904312501135:web:db03173baa400af63f91fa"
}

let db = null, FB = {}
try { const app = initializeApp(firebaseConfig); db = getDatabase(app); FB = { ref, set, get, onValue, remove } } catch(e) { console.warn('Firebase Error:', e) }
function checkFB() { if(!db) { alert('⚠️ 데이터베이스 실시간 통신망에 연결할 수 없습니다.'); return false; } return true; }

// Q&A 항목을 메인에서 제외하고 가중치 재분배 (합산 100%)
const CATS = [
  { id: 'c1', g: '학술연구역량', label: '과학적 정확성', emoji: '🔬', w: 15, desc: '연구 방법론, 실험 설계 및 데이터 처리의 오류 여부' },
  { id: 'c2', g: '학술연구역량', label: '논리적 구조', emoji: '🧩', w: 20, desc: '서론-본론-결론의 유기적 흐름 및 전개 방식' },
  { id: 'c3', g: '학술연구역량', label: '참고문헌 활용', emoji: '📚', w: 10, desc: '공인 학술지 등 신뢰성 높은 출처 및 인용 검증' },
  { id: 'c4', g: '발표 및 전달', label: '전달력 및 표현', emoji: '🎤', w: 20, desc: '발음, 성량, 시선 처리 및 자신감 있는 무대 매너' },
  { id: 'c5', g: '발표 및 전달', label: '시각자료 품질', emoji: '📊', w: 20, desc: '메시지 핵심 시각화 및 가독성, 인포그래픽 수준' },
  { id: 'c6', g: '발표 및 전달', label: '시간 준수 수준', emoji: '⏱️', w: 5, desc: '규정된 발표 배정 시간의 정확한 타임 키핑' },
  { id: 'c7', g: '발표 및 전달', label: '독창성과 창의성', emoji: '💡', w: 10, desc: '아이디어의 신선함 및 프레젠테이션 연출력' }
]

// Q&A 대응력을 요구사항에 맞춰 보너스 점수 영역으로 배치
const BONUS = { id: 'bonus', label: 'Q&A 실시간 대응력', emoji: '❓', desc: '질문의 본질을 명확히 파악하고 유연하면서도 전문적인 답변을 제공했는가?' }
const MC = ['#fbbf24', '#94a3b8', '#d97706']
const BC = ['#635bff', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#14b8a6']

function $(id) { return document.getElementById(id); }
function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = ''; for(let i=0; i<6; i++) r += c[Math.floor(Math.random() * c.length)]; return r; }

let S = {};
function resetState() { 
  if(S.unsub) S.unsub(); if(S.unsub2) S.unsub2(); 
  S = { sessionId: null, config: null, scores: {}, online: {}, role: null, scorerName: '', scorerGroup: null, groupCount: 2, groups: [], staffMembers: ['',''], myScores: {}, submitted: false, prevGroup: -1, showRes: false, unsub: null, unsub2: null, joinUrl: '', setupStep: 0, voteStep: 0, joinStep: 0, joinGI: -1, bonusMode: false, bonusGI: 0, bonusScores: {} } 
}
resetState();

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }

// 핵심 기능: 계산 오류 방지 및 원클릭 합산 처리 로직 보완
function calcResult(scores, gid) {
  const gs = scores?.[gid];
  if (!gs || typeof gs !== 'object') return { avg: {}, mt: 0, bt: 0, total: 0, count: 0 };
  
  // 객체 형태인 심사위원 데이터 명단만 정확하게 취합 (submittedAt 무시)
  const scorers = Object.keys(gs).filter(k => gs[k] && typeof gs[k] === 'object');
  if (!scorers.length) return { avg: {}, mt: 0, bt: 0, total: 0, count: 0 };
  
  const avg = {};
  CATS.forEach(c => {
    const v = [];
    scorers.forEach(s => {
      if (gs[s] && typeof gs[s][c.id] === 'number') v.push(gs[s][c.id]);
    });
    avg[c.id] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
  });
  
  const bv = [];
  scorers.forEach(s => {
    if (gs[s] && typeof gs[s].bonus === 'number') bv.push(gs[s].bonus);
  });
  avg.bonus = bv.length ? bv.reduce((a, b) => a + b, 0) / bv.length : 0;
  
  const mt = CATS.reduce((s, c) => s + (avg[c.id] / 10) * c.w, 0);
  return { avg, mt, bt: avg.bonus, total: mt + avg.bonus, count: scorers.length };
}

// 계산 오류 필터링 버그를 삭제하여 초기 상태에서도 정렬 유지되도록 개선
function getRanked() {
  if (!S.config) return [];
  return S.config.groups
    .filter(g => !g.isStaff)
    .map(g => ({ ...g, result: calcResult(S.scores, g.id) }))
    .sort((a, b) => b.result.total - a.result.total);
}

function findGroup(name) {
  if (!S.config) return null;
  for (const g of S.config.groups) { if (g.members?.includes(name)) return g; }
  return null;
}

// 해시 라우팅 관리
function getParam(key) {
  const h = window.location.hash.replace('#', '');
  if (h.startsWith(key + '=')) return h.split('=')[1];
  return new URLSearchParams(window.location.search).get(key);
}

const JOIN_CODE = getParam('join');
const LIVE_CODE = getParam('live');

function handleRoute() {
  if (JOIN_CODE) {
    resetState(); S.sessionId = JOIN_CODE.toUpperCase();
    showScreen('screen-join');
    $('join-badge').textContent = `CODE: ${S.sessionId}`;
    loadJoinScreen(); return;
  }
  if (LIVE_CODE) { resetState(); S.sessionId = LIVE_CODE.toUpperCase(); loadLive(); return; }
  showScreen('screen-home');
}
window.addEventListener('hashchange', () => { location.reload(); });
handleRoute();

window.goHome = function() { if(JOIN_CODE) { location.hash = ''; location.reload(); return; } resetState(); showScreen('screen-home'); }
window.goSetup = function() { resetState(); S.setupStep = 0; showScreen('screen-setup'); renderSetup(); }
window.openLivePrompt = function() { const c = prompt('연결할 세션 코드를 입력하세요:'); if(c?.trim()) { const b = window.location.href.split('#')[0]; window.open(`${b}#live=${c.trim().toUpperCase()}`, '_blank'); } }
window.openLiveFromAdmin = function() { const b = window.location.href.split('#')[0]; window.open(`${b}#live=${S.sessionId}`, '_blank'); }

// 세션 생성 마법사 단계별 화면 랜더링
function getTotalSteps() { return S.groupCount + 3; }
function renderSetup() {
  const step = S.setupStep, total = getTotalSteps();
  $('setup-step-label').textContent = `${step + 1} / ${total}`;
  let dots = ''; for (let i = 0; i < total; i++) dots += `<div class="dot ${i === step ? 'active' : i < step ? 'done' : ''}"></div>`;
  $('setup-dots').innerHTML = dots;
  const box = $('setup-content');
  
  if (step === 0) {
    $('setup-title').textContent = '⚙️ 세션 코드 및 규모 설정';
    box.innerHTML = `
      <div class="card" style="padding:24px;">
        <h2 style="font-size:15px; font-weight:700; margin-bottom:12px">커스텀 세션 코드 명칭 지정</h2>
        <input class="input mono" id="inp-code" placeholder="미입력 시 무작위 자동 할당" maxlength="10" value="${S.customCode||''}" style="font-size:16px; letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:24px">
        <h2 style="font-size:15px; font-weight:700; margin-bottom:16px">참가팀 총 조수 선택</h2>
        <div id="gc-grid" style="display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:24px"></div>
        <button class="btn btn-primary btn-block" style="padding:14px;" onclick="setupNext()">다음 단계로 진행 →</button>
      </div>`;
    const g = $('gc-grid');
    for (let n = 2; n <= 10; n++) {
      const b = document.createElement('button'); b.textContent = n;
      b.style.cssText = `aspect-ratio:1; border-radius:12px; font-size:18px; font-weight:800; border:2px solid ${n===S.groupCount?'var(--primary)':'var(--border-color)'}; background:${n===S.groupCount?'var(--primary-glow)':'#07070f'}; color:${n===S.groupCount?'#9c97ff':'var(--text-muted)'}`;
      b.onclick = () => { S.groupCount = n; renderSetup(); };
      g.appendChild(b);
    }
    return;
  }
  
  const gi = step - 1;
  if (gi >= 0 && gi < S.groupCount) {
    while (S.groups.length < S.groupCount) S.groups.push({ id: 'g' + (S.groups.length + 1), name: (S.groups.length + 1) + '조', members: ['', ''] });
    const g = S.groups[gi];
    $('setup-title').textContent = `👥 명단 작성 (${g.name})`;
    let h = `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
          <h2 style="font-size:16px; font-weight:700">${g.name} 발표자 인원 <span class="mono" style="color:var(--primary)">(${g.members.filter(m=>m.trim()).length}명)</span></h2>

        </div>
        <p style="color:var(--text-muted); font-size:12px; margin-bottom:16px">스태프는 모든 조를 차별 없이 상시 전방위 채점할 수 있습니다.</p>
        <div style="display:flex; flex-direction:column; gap:8px">`;
    S.staffMembers.forEach((m, i) => {
      h += `
        <div style="display:flex; gap:6px">
          <input class="input" value="${m}" oninput="wizUpdS(${i},this.value)" placeholder="운영진 성명 입력 ${i+1}">

    });
    h += `</div><div style="display:flex; gap:8px; margin-top:24px"><button class="btn btn-outline" onclick="setupBack()" style="flex:1">이전</button><button class="btn btn-primary" onclick="setupNext()" style="flex:2">다음 →</button></div></div>`;

  }
  
  $('setup-title').textContent = '✅ 세션 개설 전 최종 검증';

  const sc = S.staffMembers.filter(m => m.trim()).length;

    const m = g.members.filter(x => x.trim());

  });

    </div>

window.setupNext = function() {
  if (S.setupStep === 0) {
    S.customCode = $('inp-code')?.value?.trim()?.toUpperCase()?.replace(/[^A-Z0-9]/g, '') || '';
    while (S.groups.length < S.groupCount) S.groups.push({ id: 'g' + (S.groups.length + 1), name: (S.groups.length + 1) + '조', members: ['', ''] });
    if (S.groups.length > S.groupCount) S.groups.length = S.groupCount;
  }
  S.setupStep++; renderSetup();
}
window.setupBack = function() { if (S.setupStep <= 0) { showScreen('screen-home'); return; } S.setupStep--; renderSetup(); }
window.wizAdd = function(gi) { S.groups[gi].members.push(''); renderSetup(); }
window.wizRm = function(gi, mi) { if (S.groups[gi].members.length <= 1) return; S.groups[gi].members.splice(mi, 1); renderSetup(); }
window.wizUpd = function(gi, mi, v) { S.groups[gi].members[mi] = v; }
window.wizAddS = function() { S.staffMembers.push(''); renderSetup(); }
window.wizRmS = function(i) { if (S.staffMembers.length <= 1) return; S.staffMembers.splice(i, 1); renderSetup(); }
window.wizUpdS = function(i, v) { S.staffMembers[i] = v; }

window.createSession = async function() {
  if (!checkFB()) return;
  const btn = $('btn-create'); btn.disabled = true; btn.textContent = '통신망 생성 가동 중...';
  try {
    let sid = S.customCode;
    if (sid && sid.length < 4) { alert('코드는 최소 4자 이상 선언해야 합니다.'); btn.disabled = false; btn.textContent = '🚀 생성'; return; }
    if (!sid) sid = genCode();
    const ex = await FB.get(FB.ref(db, `sessions/${sid}`));
    if (ex.val()) { alert(`"${sid}" 코드는 이미 선점된 세션입니다.`); btn.disabled = false; return; }
    
    const cl = S.groups.slice(0, S.groupCount).map(g => ({ ...g, members: g.members.filter(m => m.trim()), isStaff: false }));
    const st = S.staffMembers.filter(m => m.trim());
    if (st.length > 0) cl.push({ id: 'staff', name: '운영진 스태프', members: st, isStaff: true });
    
    await FB.set(FB.ref(db, `sessions/${sid}`), {
      config: { groups: cl, currentGroup: -1, finished: false, bonusOpen: false }, scores: {}, online: {}
    });
    S.sessionId = sid; S.role = 'admin'; loadAdmin();
  } catch(err) { alert('엔진 오류: ' + err.message); btn.disabled = false; }
}

// ADMIN CONTROL SCREEN
function loadAdmin() {
  showScreen('screen-admin');
  $('admin-session-id').textContent = `ACTIVE SESSION: ${S.sessionId}`;
  const b = window.location.href.split('#')[0]; S.joinUrl = `${b}#join=${S.sessionId}`;

function renderAdmin() {
  if (S.showRes) { renderAdminRes(); return; }
  let html = ''; const on = Object.keys(S.online);
  
  // 요구사항 3: 접속 여부 및 인원 파악 인터페이스 배치
  html += `
    <div style="background:rgba(16,185,129,0.03); border:1px solid rgba(16,185,129,0.15); border-radius:14px; padding:14px; margin-bottom:14px">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px">
        <span style="font-size:14px">👥</span><span style="font-size:13px; font-weight:700; color:var(--success)">실시간 참여 위원단 현황</span>
        <span class="mono badge badge-success">${on.length}명 대기</span>
      </div>
      ${on.length ? '<div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:10px">' + on.map(n => `<span style="background:${S.online[n]?.isStaff ? 'rgba(168,85,247,0.1)':'#07070f'}; border:1px solid ${S.online[n]?.isStaff ? 'rgba(168,85,247,0.2)':'var(--border-color)'}; border-radius:6px; padding:4px 8px; font-size:11px; color:${S.online[n]?.isStaff ? '#b975ff':'#c5c5d2'}">${n}</span>`).join('') + '</div>' : '<p style="font-size:11px; color:var(--text-muted); margin-top:6px">접속자가 한 명도 없습니다. 링크를 배포하세요.</p>'}
    </div>`;
    
  S.config.groups.filter(g => !g.isStaff).forEach(group => {
    const ri = S.config.groups.indexOf(group);
    const isCur = S.config.currentGroup === ri;
    const gs = S.scores[group.id] || {};
    const scored = Object.keys(gs).filter(k => gs[k] && typeof gs[k] === 'object');
    const res = calcResult(S.scores, group.id);
    
    // 타 조 팀원 및 Staff만 채점 자격 부여 (본인 조 채점 방지)
    const eligible = on.filter(n => { const g2 = findGroup(n); return !g2 || g2.isStaff || g2.id !== group.id; });
    const done = eligible.filter(n => scored.includes(n));
    const pending = eligible.filter(n => !scored.includes(n));
    
    html += `
      <div class="card" style="position:relative; overflow:hidden; ${isCur ? 'border-color:var(--primary); background:linear-gradient(135deg,#0d0d26, #0d0d19)' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:center">
          <div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
              <span style="font-size:16px; font-weight:700; color:${isCur?'#9c97ff':'#fff'}">${group.name}</span>
              ${isCur ? '<span class="badge badge-live">● 발표 LIVE</span>' : ''}
              ${scored.length > 0 ? `<span class="badge badge-success">${scored.length}명 채점완료</span>` : ''}
            </div>
            <div style="color:var(--text-muted); font-size:12px; margin-top:4px">${group.members.join(' · ')}</div>
            <div class="mono" style="color:var(--warning); font-size:14px; font-weight:700; margin-top:6px">중간점수: ${res.mt.toFixed(1)}${res.bt > 0 ? ' + ⭐' + res.bt.toFixed(1) : ''} = ${res.total.toFixed(1)}점</div>
          </div>
          <button class="btn ${isCur ? 'btn-outline' : 'btn-primary'} btn-sm" onclick="startGroup(${ri})">${res.count > 0 ? '재기동' : '발표시작'}</button>
        </div>`;
        
    // 요구사항 3: 미채점자 / 채점 완료자 식별 인터페이스 시각화
    if (isCur && eligible.length) {
      html += `
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border-color)">
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:6px">실시간 채점 참여 진척도 (${done.length}/${eligible.length})</div>
          <div style="display:flex; flex-wrap:wrap; gap:4px">
            ${done.map(n => `<span class="status-chip done">✓ ${n}</span>`).join('')}
            ${pending.map(n => `<span class="status-chip pending">… ${n}</span>`).join('')}
          </div>
        </div>`;
    }
    html += `</div>`;
  });
  
  $('admin-body').innerHTML = html;
  
  let btns = `<button class="btn btn-success btn-block" style="padding:14px;" onclick="finishAll()">🏆 메인 발표 세션 완전 심사종료</button>`;
  if (S.config.finished && !S.config.bonusOpen) btns += `<button class="btn btn-bonus btn-block" style="padding:14px;" onclick="openBonus()">⭐ 요구사항 [Q&A 보너스 채점 벨브] 개방</button>`;
  if (S.config.bonusOpen) btns += `<div style="text-align:center; padding:12px; background:rgba(236,72,153,0.06); border:1px solid rgba(236,72,153,0.15); border-radius:12px; color:var(--bonus); font-size:13px; font-weight:700">⭐ 실시간 보너스 채점 벨브 가동 중</div>`;
  btns += `<button class="btn btn-outline btn-block" onclick="openFullResults()">📊 최종 결과 보충 보드 보기</button><button class="btn btn-outline btn-block" onclick="openLiveFromAdmin()" style="color:var(--danger); border-color:rgba(239,68,68,0.2)">📺 스코어 프로젝터 화면 열기</button>`;
  $('admin-buttons').innerHTML = btns;
}

window.finishAll = async function() { if(!checkFB()) return; await FB.set(FB.ref(db, `sessions/${S.sessionId}/config`), { ...S.config, finished: true, currentGroup: -1 }); }
window.openBonus = async function() { if(!checkFB()) return; await FB.set(FB.ref(db, `sessions/${S.sessionId}/config`), { ...S.config, bonusOpen: true }); }
window.toggleAdminView = function() { S.showRes = !S.showRes; $('btn-toggle').textContent = S.showRes ? '조 대기 현황' : '📊 결과전환'; renderAdmin(); }
window.resetSession = async function() { if(!confirm('세션을 초기화하시겠습니까? 데이터가 파괴됩니다.')) return; if(!checkFB()) return; await FB.remove(FB.ref(db, `sessions/${S.sessionId}`)); goHome(); }
window.copyLink = function() { navigator.clipboard.writeText(S.joinUrl).then(() => { $('btn-copy').textContent = '완료✓'; setTimeout(() => $('btn-copy').textContent = '복사', 2000); }).catch(() => { prompt('아래 링크를 복사하세요:', S.joinUrl); }); }
window.openFullResults = function() { showScreen('screen-results'); renderResults(); }

// VOTER JOIN SYSTEM
async function loadJoinScreen() {
  showScreen('screen-join'); S.scorerName = ''; S.joinStep = 0;
  try {
    const snap = await FB.get(FB.ref(db, `sessions/${S.sessionId}`)); const d = snap.val();

          <div style="display:flex; align-items:center; gap:10px">

}

window.selJoinG = function(i) { S.joinGI = i; S.joinStep = 1; S.scorerName = ''; renderJoin(); }
window.joinBack = function() { S.joinStep = 0; S.scorerName = ''; renderJoin(); }
window.selJoinN = function(n) { S.scorerName = n; renderJoin(); }
window.jcInput = function(v) { S.scorerName = v.trim(); const b = document.querySelector('#join-body .btn-primary'); if(b) b.disabled = !S.scorerName; }
window.doJoin = async function() {
  if (!S.scorerName.trim()) return; S.scorerGroup = findGroup(S.scorerName);

// REALTIME SCORER INTERFACE
function loadVote() {
  if (!checkFB()) return; showScreen('screen-vote'); S.myScores = {}; S.submitted = false; S.prevGroup = -99; S.bonusMode = false;
  if (S.unsub) S.unsub();
  S.unsub = FB.onValue(FB.ref(db, `sessions/${S.sessionId}`), (snap) => {
    const d = snap.val(); if (!d) return;
    S.config = d.config; S.scores = d.scores || {}; S.scorerGroup = findGroup(S.scorerName);
    renderVote();
  });
}

function renderVote() {
  const { config: c, scores, scorerName: sn } = S;
  $('vote-footer').textContent = `위원명: ${sn}${S.scorerGroup?.isStaff ? ' (Staff)' : ''} | ID: ${S.sessionId}`;
  
  if (c.bonusOpen && !S.bonusMode) { S.bonusMode = true; S.bonusGI = 0; S.bonusScores = {}; }
  if (S.bonusMode && c.bonusOpen) { renderBonusVote(); return; }
  
  if (c.currentGroup !== S.prevGroup) {
    S.prevGroup = c.currentGroup; S.myScores = {}; S.submitted = false; S.voteStep = 0;
    if (c.currentGroup >= 0) {
      const gid = c.groups[c.currentGroup]?.id; const ex = scores?.[gid]?.[sn];
      if (ex) { CATS.forEach(ct => { if(typeof ex[ct.id] === 'number') S.myScores[ct.id] = ex[ct.id]; }); S.submitted = true; }
    }
  }
  
  if (c.currentGroup === -1 && !c.finished) {
    $('vote-banner').innerHTML = '';
    $('vote-body').innerHTML = `<div style="text-align:center; padding:60px 20px"><div style="font-size:44px; margin-bottom:12px">⏳</div><h2 style="font-size:16px; font-weight:700">다음 발표 대기 상태</h2><p style="color:var(--text-muted); font-size:13px; margin-top:4px">총괄 통제관이 발표를 시작하면 자동으로 활성화됩니다.</p></div>`;
    return;
  }
  if (c.finished && !c.bonusOpen) {
    $('vote-banner').innerHTML = '';
    $('vote-body').innerHTML = `<div style="text-align:center; padding:60px 20px"><div style="font-size:44px; margin-bottom:12px">🏆</div><h2 style="font-size:16px; font-weight:700">모든 메인 서면 평가 종료</h2><p style="color:var(--text-muted); font-size:13px; margin-top:4px">운영진측 Q&A 보너스 심사 개방을 기다리고 있습니다.</p></div>`;
    return;
  }
  
  const cg = c.groups[c.currentGroup];
  $('vote-banner').innerHTML = `
    <div style="background:linear-gradient(135deg, rgba(99,91,255,0.06), #0d0d19); border:1px solid rgba(99,91,255,0.2); border-radius:14px; padding:16px; margin-bottom:14px; text-align:center">
      <span class="badge badge-live">● LIVE ASSESSMENT</span>
      <div style="font-size:24px; font-weight:900; color:#9c97ff; margin-top:6px">${cg?.name} 발표 평가</div>
    </div>`;
    
  if (S.scorerGroup && !S.scorerGroup.isStaff && S.scorerGroup.id === cg?.id) {
    $('vote-body').innerHTML = `<div style="background:rgba(245,158,11,0.05); border:1px solid rgba(245,158,11,0.15); border-radius:14px; padding:32px; text-align:center"><div style="font-size:40px; margin-bottom:8px">🎤</div><h3 style="font-size:15px; font-weight:700">현재 소속 조의 발표 진행 중입니다</h3><p style="color:var(--text-muted); font-size:12px; margin-top:4px">공정 심사를 위해 본인 소속 팀에는 투표할 수 없습니다.</p></div>`;
    return;
  }
  if (S.submitted) {
    $('vote-body').innerHTML = `<div style="background:rgba(16,185,129,0.05); border:1px solid rgba(16,185,129,0.15); border-radius:14px; padding:32px; text-align:center"><div style="font-size:40px; margin-bottom:8px">✅</div><h3 style="font-size:15px; font-weight:700">본 조의 데이터 전송 완료</h3><p style="color:var(--text-muted); font-size:12px; margin-top:4px">다음 발표 조 통제가 내려질 때까지 잠시 대기하세요.</p></div>`;
    return;
  }
  renderVoteCard();
}

function renderVoteCard() {
  const cat = CATS[S.voteStep]; const v = S.myScores[cat.id] || 0;
  const isL = S.voteStep === CATS.length - 1; const isF = S.voteStep === 0;
  const allOk = CATS.every(c => S.myScores[c.id] > 0);
  
  let strip = '<div style="display:flex; gap:3px; margin-bottom:14px">';
  CATS.forEach((c, i) => {
    const sv = S.myScores[c.id] || 0; const cur = i === S.voteStep;
    strip += `<div onclick="goVS(${i})" style="flex:1; cursor:pointer; background:${cur ? 'var(--primary-glow)':'#07070f'}; border:1px solid ${cur ? 'var(--primary)':sv ? 'rgba(16,185,129,0.3)':'var(--border-color)'}; border-radius:6px; padding:6px 2px; text-align:center"><div style="font-size:11px">${sv||'-'}</div></div>`;
  });
  strip += '</div>';
  
  let card = `
    <div id="vc-wrap" style="touch-action:pan-y">
      <div id="vc" class="card" style="min-height:180px; transition: transform 0.1s;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px">
          <div>
            <div style="font-weight:700; font-size:16px; display:flex; align-items:center; gap:6px"><span>${cat.emoji}</span>${cat.label}</div>
            <div style="margin-top:4px"><span class="badge badge-weight">가중치 ${cat.w}%</span></div>
          </div>
          ${v ? `<div class="mono" style="font-size:32px; font-weight:900; color:var(--primary)">${v}</div>` : '<div style="font-size:11px; color:var(--text-muted)">점수선택 필요</div>'}
        </div>
        <p style="color:#b2b2cc; font-size:12px; line-height:1.5; margin-bottom:20px">${cat.desc}</p>
        <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap">`;
  for (let s = 1; s <= 10; s++) {
    const on = s <= v;
    card += `<button onclick="setS('${cat.id}',${s})" style="width:34px; height:38px; border-radius:8px; border:1px solid ${on ? 'var(--warning)':'var(--border-color)'}; background:${on ? 'rgba(255,158,11,0.12)':'#07070f'}; color:${on ? 'var(--warning)':'var(--text-muted)'}; font-size:13px; font-weight:700" class="mono">${s}</button>`;
  }
  card += '</div></div></div>';
  
  let nav = '<div style="display:flex; gap:8px; margin-top:14px">';
  if (!isF) nav += `<button class="btn btn-outline" onclick="vsPrev()" style="flex:1">← 이전</button>`;
  if (!isL) nav += `<button class="btn btn-primary" onclick="vsNext()" style="flex:${isF?3:2}" ${!v?'disabled':''}>다음 항목</button>`;
  if (isL) nav += `<button class="btn btn-success btn-lg" onclick="submitMain()" style="flex:2" ${!allOk?'disabled':''}>${allOk?'📥 완성본 최종 제출':`${CATS.filter(c=>!S.myScores[c.id]).length}문항 누락`}</button>`;
  nav += '</div>';
  
  $('vote-body').innerHTML = strip + card + nav;
}

// 요구사항 5: Q&A 보너스 입력 분리 모듈 구현
function renderBonusVote() {
  const ngs = S.config.groups.filter(g => !g.isStaff);
  if (S.bonusGI >= ngs.length) {
    $('vote-banner').innerHTML = '';
    $('vote-body').innerHTML = `<div style="text-align:center; padding:40px 20px"><div style="font-size:44px; margin-bottom:12px">🎉</div><h2 style="font-size:16px; font-weight:700">모든 보너스 평가 완료</h2><p style="font-size:12px; color:var(--text-muted); margin-top:4px">전사 심사 일정이 완전 마감되었습니다.</p></div>`;
    return;
  }
  const g = ngs[S.bonusGI]; const isMy = S.scorerGroup && !S.scorerGroup.isStaff && S.scorerGroup.id === g.id;
  const exB = S.scores?.[g.id]?.[S.scorerName]?.bonus;
  
  $('vote-banner').innerHTML = `
    <div style="background:linear-gradient(135deg, rgba(236,72,153,0.06), #0d0d19); border:1px solid rgba(236,72,153,0.2); border-radius:14px; padding:16px; margin-bottom:14px; text-align:center">
      <span class="badge badge-bonus">⭐ Q&A BONUS 심사</span>
      <div style="font-size:24px; font-weight:900; color:var(--bonus); margin-top:6px">${g.name} 검증</div>
    </div>`;
    
  if (isMy) { $('vote-body').innerHTML = `<div class="card" style="text-align:center; padding:24px;"><p style="color:var(--warning); font-size:13px">자기 조 패스</p><button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="bonusNxt()">다음 조 넘어가기 →</button></div>`; return; }
  if (typeof exB === 'number') { $('vote-body').innerHTML = `<div class="card" style="text-align:center; padding:24px;"><p style="color:var(--success); font-size:13px">반영 완료 (⭐ ${exB}점)</p><button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="bonusNxt()">다음 조 넘어가기 →</button></div>`; return; }
  
  const v = S.bonusScores[g.id] || 0;
  let h = `
    <div class="card" style="border-color:rgba(236,72,153,0.2)">
      <div style="font-weight:700; font-size:15px; margin-bottom:4px; display:flex; align-items:center; gap:6px"><span>${BONUS.emoji}</span>${BONUS.label}</div>
      <p style="color:var(--text-muted); font-size:12px; line-height:1.5; margin-bottom:16px">${BONUS.desc}</p>
      <div style="display:flex; gap:4px; justify-content:center; margin-bottom:20px; flex-wrap:wrap">`;
  for (let s = 1; s <= 10; s++) {
    const on = s <= v;
    h += `<button onclick="setBS('${g.id}',${s})" style="width:34px; height:38px; border-radius:8px; border:1px solid ${on ? 'var(--bonus)':'var(--border-color)'}; background:${on ? 'rgba(236,72,153,0.12)':'#07070f'}; color:${on ? 'var(--bonus)':'var(--text-muted)'}; font-size:13px; font-weight:700" class="mono">${s}</button>`;
  }
  h += `</div><div style="display:flex; gap:8px">${S.bonusGI > 0 ? '<button class="btn btn-outline" onclick="bonusPrv()">← 이전</button>':''}<button class="btn btn-bonus btn-block" onclick="subBonus('${g.id}')" ${!v?'disabled':''}>보너스 점수 전송 & 다음 조 →</button></div></div>`;
  $('vote-body').innerHTML = h;
}

window.goVS = function(i) { if(S.myScores[CATS[i-1]?.id] || i===0 || S.myScores[CATS[i]?.id]) { S.voteStep = i; renderVoteCard(); } }
window.vsNext = function() { if (S.voteStep < CATS.length - 1) { S.voteStep++; renderVoteCard(); } }
window.vsPrev = function() { if (S.voteStep > 0) { S.voteStep--; renderVoteCard(); } }
window.setS = function(id, v) { S.myScores[id] = v; renderVoteCard(); }
window.submitMain = async function() {
  if (!checkFB()) return; const gid = S.config.groups[S.config.currentGroup]?.id; if (!gid) return;
  try {
    await FB.set(FB.ref(db, `sessions/${S.sessionId}/scores/${gid}/${S.scorerName}`), { ...S.myScores, submittedAt: Date.now() });
    S.submitted = true; renderVote();
  } catch(e) { alert('제출실패'); }
}
window.setBS = function(gid, v) { S.bonusScores[gid] = v; renderBonusVote(); }
window.bonusNxt = function() { S.bonusGI++; renderBonusVote(); }
window.bonusPrv = function() { if (S.bonusGI > 0) S.bonusGI--; renderBonusVote(); }
window.subBonus = async function(gid) {
  if (!checkFB()) return; const v = S.bonusScores[gid]; if (!v) return;
  try {
    await FB.set(FB.ref(db, `sessions/${S.sessionId}/scores/${gid}/${S.scorerName}/bonus`), v);
    S.bonusGI++; renderBonusVote();
  } catch(e) { alert('전송실패'); }
}

// 📺 LIVE PROJECTOR SCREEN
function loadLive() {
  if (!checkFB()) return; showScreen('screen-live');
  if (S.unsub2) S.unsub2();
  S.unsub2 = FB.onValue(FB.ref(db, `sessions/${S.sessionId}`), (snap) => {
    const d = snap.val(); if (!d) return;
    S.config = d.config; S.scores = d.scores || {}; S.online = d.online || {};
    renderLive();
  });
}

function renderLive() {
  const ranked = getRanked(); const on = Object.keys(S.online).length;
  const cg = S.config.currentGroup >= 0 ? S.config.groups[S.config.currentGroup] : null;
  
  $('live-header').innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px">
      <div style="width:8px; height:8px; background:var(--danger); border-radius:50%"></div>
      <span style="font-size:12px; font-weight:700; color:var(--danger); letter-spacing:1px">REALTIME LIVE BOARD</span>
      <span class="mono" style="color:var(--text-muted); font-size:12px">코드: ${S.sessionId}</span>
      <span class="badge badge-success mono">${on}명 연결됨</span>
    </div>
    ${cg ? `<div style="font-size:28px; font-weight:900; color:#fff">🎤 발표 진행 조: <span style="color:var(--primary)">${cg.name}</span></div>` : S.config.finished ? '<div style="font-size:22px; font-weight:900; color:var(--success)">🏆 모든 조 심사 마감</div>' : '<div style="color:var(--text-muted); font-size:14px">발표 준비 대기 상태</div>'}`;
    
  if (!ranked.length) { $('live-body').innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:40px">집계 대기 중...</p>'; return; }
  
  let html = ''; const maxT = ranked[0]?.result?.total || 100;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : BC[i % BC.length];
    const pct = maxT > 0 ? ((g.result.total / maxT) * 100).toFixed(0) : 0;
    html += `
      <div class="chart-row">
        <div style="display:flex; align-items:center; gap:8px; width:100px">
          <span class="mono" style="font-size:18px; font-weight:900; color:${mc}; width:20px">${i+1}</span>
          <span style="font-size:14px; font-weight:700">${g.name}</span>
        </div>
        <div class="chart-container">
          <div class="chart-bar" style="width:${pct}%; background:linear-gradient(90deg, ${mc}88, ${mc})"></div>
          <span class="mono" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:13px; font-weight:800">${g.result.total.toFixed(1)} 점</span>
        </div>
      </div>`;
  });
  
  // 항목별 전광판 표 레이아웃 개선
  html += `
    <div class="card" style="margin-top:24px; padding:16px; overflow:hidden">
      <h3 style="font-size:13px; font-weight:700; margin-bottom:12px; color:#9c97ff">📋 각 세부 평가 항목별 평균 평점 현황</h3>
      <div style="overflow-x:auto">
        <table>
          <tr>
            <th style="text-align:left;">대상 조</th>`;
  CATS.forEach(c => { html += `<th>${c.emoji}<br>${c.w}%</th>`; });
  html += `<th style="color:var(--bonus)">⭐ Q&A</th><th style="color:#fff">총 스코어</th></tr>`;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : 'var(--text-main)';
    html += `<tr><td style="text-align:left; font-weight:700">${g.name}</td>`;
    CATS.forEach(c => {
      const v = g.result.avg[c.id] || 0;
      html += `<td class="mono" style="background:rgba(99,91,255,${((v/10)*0.15).toFixed(2)})">${v.toFixed(1)}</td>`;
    });
    html += `<td class="mono" style="color:var(--bonus)">${g.result.bt > 0 ? g.result.bt.toFixed(1) : '-'}</td><td class="mono" style="font-size:14px; font-weight:900; color:${mc}">${g.result.total.toFixed(1)}</td></tr>`;
  });
  html += `</table></div></div>`;
  $('live-body').innerHTML = html;
}

// 🏆 FINAL DETAILED RESULTS SCREEN
function renderResults() {
  const ranked = getRanked();
  $('results-sub').textContent = `세션코드: ${S.sessionId} | ${ranked.length}개 조 최종 산출 완료`;
  if (!ranked.length) { $('results-body').innerHTML = '<p style="color:var(--text-muted); text-align:center;">출력할 데이터가 없습니다.</p>'; return; }
  
  let html = '';
  if (ranked.length >= 1) {
    html += '<div style="display:flex; justify-content:center; align-items:flex-end; gap:10px; margin:20px auto 36px; max-width:500px; min-height:160px">';
    const podiumOrder = [1, 0, 2]; // 2등, 1등, 3등 배치 순서
    podiumOrder.forEach(pi => {
      const g = ranked[pi]; if (!g) return;
      const isFirst = pi === 0;
      html += `
        <div style="background:var(--bg-card); border:1px solid ${MC[pi]}44; border-radius:14px; padding:16px 10px; text-align:center; flex:1; ${isFirst ? 'transform:scale(1.08); border-color:var(--warning); box-shadow:0 10px 30px rgba(251,191,36,0.08)':''}">
          <div style="font-size:${isFirst?36:28}px; margin-bottom:4px">${['🥇','🥈','🥉'][pi]}</div>
          <div style="font-weight:700; font-size:14px; color:#fff">${g.name}</div>
          <div class="mono" style="font-size:${isFirst?22:18}px; font-weight:900; color:${MC[pi]}; margin-top:6px">${g.result.total.toFixed(1)}</div>
        </div>`;
    });
    html += '</div>';
  }
  
  // 종합 리더보드 바 배치
  html += `<div class="card"><h3 style="font-size:14px; font-weight:700; margin-bottom:16px">📊 최종 누적 스코어 레이더</h3>`;
  const mx = ranked[0]?.result?.total || 100;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : BC[i % BC.length];
    html += `
      <div class="chart-row">
        <span style="font-size:13px; font-weight:700; width:50px">${g.name}</span>
        <div class="chart-container" style="height:24px;">
          <div class="chart-bar" style="width:${mx > 0 ? ((g.result.total / mx) * 100).toFixed(0) : 0}%; background:${mc}"></div>
          <span class="mono" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:12px; font-weight:700">${g.result.total.toFixed(1)}</span>
        </div>
      </div>`;
  });
  html += `</div>`;
  
  // 세부 항목별 분포 차트 표 시각화
  html += `<div class="card" style="padding:16px"><h3 style="font-size:14px; font-weight:700; margin-bottom:16px">🎯 최종 디테일 매트릭스 점수표</h3><div style="overflow-x:auto"><table><tr><th style="text-align:left">순위 / 조 명칭</th>`;
  CATS.forEach(c => { html += `<th>${c.emoji}<br>${c.w}%</th>`; });
  html += `<th style="color:var(--bonus)">⭐ Q&A</th><th style="color:var(--primary)">최종합계</th></tr>`;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : 'var(--text-main)';
    html += `<tr><td style="text-align:left; font-weight:700"><span style="color:${mc}; margin-right:6px">#${i+1}</span>${g.name}</td>`;
    CATS.forEach(c => {
      html += `<td class="mono">${(g.result.avg[c.id] || 0).toFixed(1)}</td>`;
    });
    html += `<td class="mono" style="color:var(--bonus)">${g.result.bt > 0 ? g.result.bt.toFixed(1) : '-'}</td><td class="mono" style="font-size:14px; font-weight:900; color:${mc}">${g.result.total.toFixed(1)}</td></tr>`;
  });
  html += `</table></div></div>`;
  
  $('results-body').innerHTML = html;
}
</script>
</body>
</html>
