<style>

<script type="module">

try {

} catch(e) {

function checkFB() { 
  if(!db) {

  return true; 
}

// 7대 핵심 본 심사 항목 (가중치 100%)
const CATS = [
  { id: 'c1', g: '학술연구역량', label: '과학적 정확성', emoji: '🔬', w: 15, desc: '연구 방법론, 실험 설계 및 데이터 처리의 오류 여부' },
  { id: 'c2', g: '학술연구역량', label: '논리적 구조', emoji: '🧩', w: 20, desc: '서론-본론-결론의 유기적 흐름 및 전개 방식' },
  { id: 'c3', g: '학술연구역량', label: '참고문헌 활용', emoji: '📚', w: 10, desc: '공인 학술지 등 신뢰성 높은 출처 및 인용 검증' },
  { id: 'c4', g: '발표 및 전달', label: '전달력 및 표현', emoji: '🎤', w: 20, desc: '발음, 성량, 시선 처리 및 자신감 있는 무대 매너' },
  { id: 'c5', g: '발표 및 전달', label: '시각자료 품질', emoji: '📊', w: 20, desc: '메시지 핵심 시각화 및 가독성, 인포그래픽 수준' },
  { id: 'c6', g: '발표 및 전달', label: '시간 준수 수준', emoji: '⏱️', w: 5, desc: '규정된 발표 배정 시간의 정확한 타임 키핑' },
  { id: 'c7', g: '발표 및 전달', label: '독창성과 창의성', emoji: '💡', w: 10, desc: '아이디어의 신선함 및 프레젠테이션 연출력' }
]

const BONUS = { id: 'bonus', label: 'Q&A 실시간 대응력', emoji: '❓', desc: '질문의 본질을 명확히 파악하고 유연하면서도 전문적인 답변을 제공했는가?' }
const MC = ['#fbbf24', '#94a3b8', '#d97706']
const BC = ['#635bff', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#14b8a6']

// 커스텀 모던 토스트 알림창
window.showToast = function(message, type = 'success') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast-animate p-4 rounded-2xl glass shadow-2xl flex items-center gap-3 border pointer-events-auto transition duration-300`;
  
  let icon = 'ℹ️';
  let borderColor = 'rgba(255, 255, 255, 0.1)';
  if (type === 'success') { icon = '✅'; borderColor = 'rgba(16, 185, 129, 0.3)'; }
  else if (type === 'error') { icon = '❌'; borderColor = 'rgba(239, 68, 68, 0.3)'; }
  else if (type === 'warning') { icon = '⚠️'; borderColor = 'rgba(245, 158, 11, 0.3)'; }
  
  toast.style.borderColor = borderColor;
  toast.innerHTML = `
    <div class="text-xl">${icon}</div>
    <div class="text-sm font-bold text-slate-100 flex-1">${message}</div>
    <button class="text-slate-400 hover:text-slate-200 text-lg font-bold" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

function $(id) { return document.getElementById(id); }
function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = ''; for(let i=0; i<6; i++) r += c[Math.floor(Math.random() * c.length)]; return r; }

let S = {};
function resetState() { 
  if(S.unsub) S.unsub(); if(S.unsub2) S.unsub2(); 
  S = { sessionId: null, config: null, scores: {}, online: {}, role: null, scorerName: '', scorerGroup: null, groupCount: 2, groups: [], staffMembers: ['',''], myScores: {}, submitted: false, prevGroup: -1, showRes: false, unsub: null, unsub2: null, joinUrl: '', setupStep: 0, voteStep: 0, joinStep: 0, joinGI: -1, bonusMode: false, bonusGI: 0, bonusScores: {} } 
}
resetState();

function showScreen(id) { 
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); 
  $(id).classList.remove('hidden'); 
}

function calcResult(scores, gid) {
  const gs = scores?.[gid];
  if (!gs || typeof gs !== 'object') return { avg: {}, mt: 0, bt: 0, total: 0, count: 0 };
  const scorers = Object.keys(gs).filter(k => gs[k] && typeof gs[k] === 'object');
  if (!scorers.length) return { avg: {}, mt: 0, bt: 0, total: 0, count: 0 };
  
  const avg = {};
  CATS.forEach(c => {
    const v = [];
    scorers.forEach(s => {
      if (gs[s] && typeof gs[s][c.id] === 'number') v.push(gs[s][c.id]);
    });
    avg[c.id] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
  });
  
  const bv = [];
  scorers.forEach(s => {
    if (gs[s] && typeof gs[s].bonus === 'number') bv.push(gs[s].bonus);
  });
  avg.bonus = bv.length ? bv.reduce((a, b) => a + b, 0) / bv.length : 0;
  
  const mt = CATS.reduce((s, c) => s + (avg[c.id] / 10) * c.w, 0);
  return { avg, mt, bt: avg.bonus, total: mt + avg.bonus, count: scorers.length };
}

function getRanked() {
  if (!S.config) return [];
  return S.config.groups
    .filter(g => !g.isStaff)
    .map(g => ({ ...g, result: calcResult(S.scores, g.id) }))
    .sort((a, b) => b.result.total - a.result.total);
}

function findGroup(name) {
  if (!S.config) return null;
  for (const g of S.config.groups) { if (g.members?.includes(name)) return g; }
  return null;
}

function getParam(key) {
  const h = window.location.hash.replace('#', '');
  if (h.startsWith(key + '=')) return h.split('=')[1];
  return new URLSearchParams(window.location.search).get(key);
}

const JOIN_CODE = getParam('join');
const LIVE_CODE = getParam('live');

function handleRoute() {
  if (JOIN_CODE) {
    resetState(); S.sessionId = JOIN_CODE.toUpperCase();
    showScreen('screen-join');
    loadJoinScreen(); return;
  }
  if (LIVE_CODE) { resetState(); S.sessionId = LIVE_CODE.toUpperCase(); loadLive(); return; }
  
  // 만약 해시가 비어있고, 특정 세션 ID가 세션스토리지나 로컬에 있다면 복구 시도 (또는 홈화면)
  showScreen('screen-home');
}
window.addEventListener('hashchange', () => { location.reload(); });
handleRoute();

window.goHome = function() { 
  if(JOIN_CODE) { 
    location.hash = ''; 
    location.reload(); 
    return; 
  } 
  resetState(); 
  showScreen('screen-home'); 
}
window.goSetup = function() { resetState(); S.setupStep = 0; showScreen('screen-setup'); renderSetup(); }
window.openLivePrompt = function() { 
  const c = prompt('연결할 세션 코드를 입력하세요:'); 
  if(c?.trim()) { 
    const b = window.location.href.split('#')[0]; 
    window.open(`${b}#live=${c.trim().toUpperCase()}`, '_blank'); 
  } 
}
window.openLiveFromAdmin = function() { 
  const b = window.location.href.split('#')[0]; 
  window.open(`${b}#live=${S.sessionId}`, '_blank'); 
}

function getTotalSteps() { return S.groupCount + 3; }
function renderSetup() {
  const step = S.setupStep, total = getTotalSteps();
  $('setup-step-label').textContent = `${step + 1} / ${total}`;
  let dots = ''; for (let i = 0; i < total; i++) dots += `<div class="dot ${i === step ? 'active' : i < step ? 'done' : ''}"></div>`;
  $('setup-dots').innerHTML = dots;
  const box = $('setup-content');
  
  if (step === 0) {
    $('setup-title').textContent = '⚙️ 세션 코드 및 규모 설정';
    box.innerHTML = `
      <div class="space-y-6">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">커스텀 세션 코드 명칭 지정</label>
          <input class="input text-center text-xl tracking-widest font-bold uppercase" id="inp-code" placeholder="미입력 시 무작위 자동 할당" maxlength="10" value="${S.customCode||''}">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">참가팀 총 조수 선택</label>
          <div id="gc-grid" class="grid grid-cols-5 gap-2"></div>
        </div>
        <button class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold transition flex items-center justify-center gap-2" onclick="setupNext()">
          다음 단계로 진행 →
        </button>
      </div>`;
    const g = $('gc-grid');
    for (let n = 2; n <= 10; n++) {
      const b = document.createElement('button'); 
      b.textContent = n;
      b.className = `aspect-square rounded-2xl text-lg font-black transition border-2 ${n===S.groupCount ? 'border-indigo-500 bg-indigo-500/10 text-indigo-300' : 'border-white/5 bg-black/40 text-slate-500 hover:border-white/10'}`;
      b.onclick = () => { S.groupCount = n; renderSetup(); };
      g.appendChild(b);
    }
    return;
  }
  
  const gi = step - 1;
  if (gi >= 0 && gi < S.groupCount) {
    while (S.groups.length < S.groupCount) S.groups.push({ id: 'g' + (S.groups.length + 1), name: (S.groups.length + 1) + '조', members: ['', ''] });
    const g = S.groups[gi];
    $('setup-title').textContent = `👥 명단 작성 (${g.name})`;
    let h = `
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-200">${g.name} 발표자 인원 <span class="mono text-indigo-400">(${g.members.filter(m=>m.trim()).length}명)</span></h2>
          <button class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/5 rounded-lg text-xs font-bold" onclick="wizAdd(${gi})">+ 추가</button>
        </div>
        <div class="space-y-2">`;
    g.members.forEach((m, mi) => {
      h += `
        <div class="flex gap-2">
          <input class="input" value="${m}" oninput="wizUpd(${gi},${mi},this.value)" placeholder="발표자 성명 입력 ${mi+1}">
          ${g.members.length > 1 ? `<button class="text-slate-500 hover:text-red-400 text-xl px-2" onclick="wizRm(${gi},${mi})">×</button>` : ''}
        </div>`;
    });
    h += `</div><div class="grid grid-cols-3 gap-2 mt-6"><button class="btn btn-outline" onclick="setupBack()">이전</button><button class="col-span-2 btn btn-primary" onclick="setupNext()">다음 →</button></div></div>`;
    box.innerHTML = h; return;
  }
  
  if (gi === S.groupCount) {
    $('setup-title').textContent = '👑 운영진/Staff 등록';
    let h = `
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-200"><span class="badge badge-staff mr-1">STAFF</span> 운영 위원 등록</h2>
          <button class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/5 rounded-lg text-xs font-bold" onclick="wizAddS()">+ 추가</button>
        </div>

        <div class="space-y-2">`;
    S.staffMembers.forEach((m, i) => {
      h += `
        <div class="flex gap-2">
          <input class="input" value="${m}" oninput="wizUpdS(${i},this.value)" placeholder="운영 위원 성명 입력 ${i+1}">
          ${S.staffMembers.length > 1 ? `<button class="text-slate-500 hover:text-red-400 text-xl px-2" onclick="wizRmS(${i})">×</button>` : ''}

  }
  
  $('setup-title').textContent = '✅ 세션 개설 최종 확인';
  const tm = S.groups.reduce((a, g) => a + g.members.filter(m => m.trim()).length, 0);
  const sc = S.staffMembers.filter(m => m.trim()).length;
  let h = `<div class="space-y-4">`;
  S.groups.slice(0, S.groupCount).forEach(g => {
    const m = g.members.filter(x => x.trim());
    h += `<div class="flex items-center justify-between p-3 bg-black/40 border border-white/5 rounded-xl"><span class="font-extrabold text-sm text-indigo-300 w-16">${g.name}</span><span class="text-xs text-slate-400 flex-1 truncate text-right mr-3">${m.join(', ') || '(비어있음)'}</span></div>`;
  });

  h += `
    <div class="p-4 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl text-center text-sm font-bold text-indigo-300">
      총계: ${S.groupCount}개 조 개설 / 발표진 ${tm}명 지정 완료
    </div>
    <div class="grid grid-cols-3 gap-2"><button class="btn btn-outline" onclick="setupBack()">수정</button><button class="col-span-2 btn btn-primary py-3.5" onclick="createSession()" id="btn-create">🚀 실시간 평가 기동</button></div></div>`;
  box.innerHTML = h;
}

window.setupNext = function() {
  if (S.setupStep === 0) {
    S.customCode = $('inp-code')?.value?.trim()?.toUpperCase()?.replace(/[^A-Z0-9]/g, '') || '';
    while (S.groups.length < S.groupCount) S.groups.push({ id: 'g' + (S.groups.length + 1), name: (S.groups.length + 1) + '조', members: ['', ''] });
    if (S.groups.length > S.groupCount) S.groups.length = S.groupCount;
  }
  S.setupStep++; renderSetup();
}
window.setupBack = function() { if (S.setupStep <= 0) { showScreen('screen-home'); return; } S.setupStep--; renderSetup(); }
window.wizAdd = function(gi) { S.groups[gi].members.push(''); renderSetup(); }
window.wizRm = function(gi, mi) { if (S.groups[gi].members.length <= 1) return; S.groups[gi].members.splice(mi, 1); renderSetup(); }
window.wizUpd = function(gi, mi, v) { S.groups[gi].members[mi] = v; }
window.wizAddS = function() { S.staffMembers.push(''); renderSetup(); }
window.wizRmS = function(i) { if (S.staffMembers.length <= 1) return; S.staffMembers.splice(i, 1); renderSetup(); }
window.wizUpdS = function(i, v) { S.staffMembers[i] = v; }

window.createSession = async function() {
  if (!checkFB()) return;
  const btn = $('btn-create'); btn.disabled = true; btn.textContent = '통신망 활성화 중...';
  try {
    let sid = S.customCode;
    if (sid && sid.length < 4) { 
      showToast('⚠️ 세션 코드는 최소 4자 이상으로 입력해주세요.', 'warning'); 
      btn.disabled = false; btn.textContent = '🚀 실시간 평가 기동'; 
      return; 
    }
    if (!sid) sid = genCode();
    const ex = await FB.get(FB.ref(db, `sessions/${sid}`));
    if (ex.val()) { 
      showToast(`⚠️ "${sid}" 코드는 이미 사용 중입니다.`, 'warning'); 
      btn.disabled = false; btn.textContent = '🚀 실시간 평가 기동'; 
      return; 
    }
    
    // **어드민 보안 토큰 키 발급 및 로컬저장**
    const adminToken = 'ADMIN-' + genCode() + '-' + genCode();
    localStorage.setItem(`admin_token_${sid}`, adminToken);
    
    const cl = S.groups.slice(0, S.groupCount).map(g => ({ ...g, members: g.members.filter(m => m.trim()), isStaff: false }));
    const st = S.staffMembers.filter(m => m.trim());
    if (st.length > 0) cl.push({ id: 'staff', name: '운영진 스태프', members: st, isStaff: true });
    
    await FB.set(FB.ref(db, `sessions/${sid}`), {
      config: { groups: cl, currentGroup: -1, finished: false, bonusOpen: false },
      scores: {},
      online: {},
      adminToken: adminToken // 보안 토큰 Firebase DB 저장
    });
    
    S.sessionId = sid; 
    S.role = 'admin'; 
    showToast('✨ 세션이 성공적으로 개설되었습니다!', 'success');
    loadAdmin();
  } catch(err) { 
    showToast('🚨 에러 발생: ' + err.message, 'error'); 
    btn.disabled = false; 
  }
}

// ADMIN CONTROL SCREEN
function loadAdmin() {
  showScreen('screen-admin');
  $('admin-session-id').textContent = `ACTIVE: ${S.sessionId}`;
  const b = window.location.href.split('#')[0]; S.joinUrl = `${b}#join=${S.sessionId}`;
  $('share-url').textContent = S.joinUrl;
  
  if (S.unsub) S.unsub();
  S.unsub = FB.onValue(FB.ref(db, `sessions/${S.sessionId}`), (snap) => {
    const d = snap.val(); 
    if (!d) { 
      goHome(); 
      return; 
    }
    
    // **[핵심 보안 조치] 어드민 토큰 검증**
    const storedToken = localStorage.getItem(`admin_token_${S.sessionId}`);
    if (!storedToken || storedToken !== d.adminToken) {
      // 토큰 불일치 시 채점자 화면으로 강제 이송 조치
      showToast('🔒 어드민 관리 권한이 없습니다. 심사위원 화면으로 이동합니다.', 'warning');
      location.hash = `#join=${S.sessionId}`;
      return;
    }
    
    S.config = d.config; S.scores = d.scores || {}; S.online = d.online || {};
    renderAdmin();
  });
}

    const done = eligible.filter(n => scored.includes(n));

              ${isCur ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-rose-500/10 border border-rose-500/20 text-rose-400 animate-pulse">● LIVE</span>' : ''}
              ${scored.length > 0 ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">${scored.length}명 심사완료</span>` : ''}
            </div>

            <div class="mono text-xs font-bold text-amber-400 mt-2">평점합산: ${res.mt.toFixed(1)}${res.bt > 0 ? ' + ⭐' + res.bt.toFixed(1) : ''} = ${res.total.toFixed(1)}점</div>
          </div>

          </button>
        </div>`;
        
    if (isCur && eligible.length) {
      html += `
        <div class="mt-4 pt-3 border-t border-white/5">
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">실시간 채점 참여 진척도 (${done.length}/${eligible.length})</div>

}

window.finishAll = async function() { if(!checkFB()) return; await FB.set(FB.ref(db, `sessions/${S.sessionId}/config`), { ...S.config, finished: true, currentGroup: -1 }); }

window.resetSession = async function() {

window.joinBack = function() { S.joinStep = 0; S.scorerName = ''; renderJoin(); }

window.jcInput = function(v) { 
  S.scorerName = v.trim();

window.doJoin = async function() {

  } catch(e){}

// REALTIME SCORER INTERFACE
function loadVote() {
  if (!checkFB()) return; 
  showScreen('screen-vote'); 
  S.myScores = {}; S.submitted = false; S.prevGroup = -99; S.bonusMode = false;
  if (S.unsub) S.unsub();
  
  S.unsub = FB.onValue(FB.ref(db, `sessions/${S.sessionId}`), (snap) => {
    const d = snap.val(); if (!d) return;
    S.config = d.config; S.scores = d.scores || {}; S.scorerGroup = findGroup(S.scorerName);
    renderVote();
  });
}

function renderVote() {
  const { config: c, scores, scorerName: sn } = S;
  $('vote-footer').textContent = `심사위원: ${sn}${S.scorerGroup?.isStaff ? ' (Staff)' : ''} | 세션코드: ${S.sessionId}`;
  
  if (c.bonusOpen && !S.bonusMode) { S.bonusMode = true; S.bonusGI = 0; S.bonusScores = {}; }
  if (S.bonusMode && c.bonusOpen) { renderBonusVote(); return; }
  
  if (c.currentGroup !== S.prevGroup) {
    S.prevGroup = c.currentGroup; S.myScores = {}; S.submitted = false; S.voteStep = 0;
    if (c.currentGroup >= 0) {
      const gid = c.groups[c.currentGroup]?.id; const ex = scores?.[gid]?.[sn];
      if (ex) { 
        CATS.forEach(ct => { if(typeof ex[ct.id] === 'number') S.myScores[ct.id] = ex[ct.id]; }); 
        S.submitted = true; 
      }
    }
  }
  
  if (c.currentGroup === -1 && !c.finished) {
    $('vote-banner').innerHTML = '';
    $('vote-body').innerHTML = `
      <div class="glass p-10 rounded-3xl text-center border border-white/5">
        <div class="text-5xl mb-4 animate-bounce">⏳</div>
        <h2 class="text-xl font-bold text-slate-200">평가 대기 중</h2>
        <p class="text-xs text-slate-400 mt-2">운영진이 발표를 시작하면 채점창이 활성화됩니다.</p>
      </div>`;
    return;
  }
  if (c.finished && !c.bonusOpen) {
    $('vote-banner').innerHTML = '';
    $('vote-body').innerHTML = `
      <div class="glass p-10 rounded-3xl text-center border border-white/5">
        <div class="text-5xl mb-4">🏆</div>
        <h2 class="text-xl font-bold text-slate-200">본선 발표 심사 마감</h2>
        <p class="text-xs text-slate-400 mt-2">운영진측 질의응답 보너스 심사 개방을 기다리고 있습니다.</p>
      </div>`;
    return;
  }
  
  const cg = c.groups[c.currentGroup];
  $('vote-banner').innerHTML = `
    <div class="glass p-6 rounded-2xl border border-indigo-500/20 text-center relative overflow-hidden bg-gradient-to-r from-indigo-950/20 via-black/40 to-indigo-950/20">
      <div class="absolute -top-12 -left-12 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl"></div>
      <span class="badge badge-live mb-2.5">● 평가 라이브</span>
      <div class="text-2xl font-black text-indigo-300">${cg?.name} 발표 평가</div>
    </div>`;
    
  if (S.scorerGroup && !S.scorerGroup.isStaff && S.scorerGroup.id === cg?.id) {
    $('vote-body').innerHTML = `
      <div class="glass p-8 rounded-3xl text-center border border-amber-500/10 bg-amber-500/5">
        <div class="text-4xl mb-3">🎤</div>
        <h3 class="text-base font-bold text-amber-400">우리 팀 발표 진행 중</h3>
        <p class="text-xs text-slate-400 mt-2 leading-relaxed">공정성을 보장하기 위해 자사 또는 아군 조에는 점수를 입력할 수 없습니다.</p>
      </div>`;
    return;
  }
  if (S.submitted) {
    $('vote-body').innerHTML = `
      <div class="glass p-8 rounded-3xl text-center border border-emerald-500/10 bg-emerald-500/5">
        <div class="text-4xl mb-3">✅</div>
        <h3 class="text-base font-bold text-emerald-400">심사 데이터 제출 완료</h3>
        <p class="text-xs text-slate-400 mt-2">다음 발표 조 통제가 내려질 때까지 잠시 대기하세요.</p>
      </div>`;
    return;
  }
  renderVoteCard();
}

function renderVoteCard() {
  const cat = CATS[S.voteStep]; const v = S.myScores[cat.id] || 0;
  const isL = S.voteStep === CATS.length - 1; const isF = S.voteStep === 0;
  const allOk = CATS.every(c => S.myScores[c.id] > 0);
  
  let strip = '<div class="flex gap-1 mb-4 overflow-x-auto pb-1">';
  CATS.forEach((c, i) => {
    const sv = S.myScores[c.id] || 0; const cur = i === S.voteStep;
    strip += `<div onclick="goVS(${i})" class="flex-1 min-w-[32px] cursor-pointer text-center py-2 rounded-lg border transition ${cur ? 'bg-indigo-500/10 border-indigo-500 text-indigo-300' : sv ? 'bg-emerald-500/5 border-emerald-500/20 text-emerald-400' : 'bg-black/30 border-white/5 text-slate-600'}"><div class="text-xs font-bold">${sv||'-'}</div></div>`;
  });
  strip += '</div>';
  
  let card = `
    <div id="vc-wrap" style="touch-action:pan-y">
      <div id="vc" class="glass p-6 rounded-2xl border border-white/5 min-h-[190px] transition duration-200">
        <div class="flex justify-between items-start gap-4 mb-3">
          <div>
            <div class="font-extrabold text-base flex items-center gap-1.5 text-slate-100">
              <span>${cat.emoji}</span>${cat.label}
            </div>
            <div class="mt-1.5"><span class="badge badge-weight">가중치 ${cat.w}%</span></div>
          </div>
          ${v ? `<div class="mono text-3xl font-black text-indigo-400">${v}</div>` : '<div class="text-[11px] text-slate-500 font-bold bg-white/5 px-2.5 py-1 rounded-md border border-white/5">선택필요</div>'}
        </div>
        <p class="text-xs text-slate-400 leading-relaxed mb-6 font-medium">${cat.desc}</p>
        <div class="grid grid-cols-5 gap-1.5">`;
  for (let s = 1; s <= 10; s++) {
    const on = s <= v;
    card += `<button onclick="setS('${cat.id}',${s})" class="mono py-2 rounded-xl border font-bold text-xs transition ${on ? 'border-amber-500/50 bg-amber-500/10 text-amber-400 font-black' : 'border-white/5 bg-black/40 text-slate-400 hover:border-white/10'}">${s}</button>`;
  }
  card += '</div></div></div>';
  
  let nav = '<div class="grid grid-cols-3 gap-2 mt-4">';
  if (!isF) nav += `<button class="btn btn-outline py-3.5" onclick="vsPrev()">← 이전</button>`;
  if (!isL) nav += `<button class="col-span-2 btn btn-primary py-3.5" onclick="vsNext()" ${!v?'disabled':''}>다음 항목</button>`;
  if (isL) nav += `<button class="col-span-2 btn btn-success py-3.5" onclick="submitMain()" ${!allOk?'disabled':''}>${allOk?'📥 완성본 최종 제출':`미기입 ${CATS.filter(c=>!S.myScores[c.id]).length}개`}</button>`;
  nav += '</div>';
  
  $('vote-body').innerHTML = strip + card + nav;
}

// Q&A 가산점 보너스 모듈 (Q&A 보너스로 이동)
function renderBonusVote() {
  const ngs = S.config.groups.filter(g => !g.isStaff);
  if (S.bonusGI >= ngs.length) {
    $('vote-banner').innerHTML = '';
    $('vote-body').innerHTML = `
      <div class="glass p-10 rounded-3xl text-center border border-pink-500/10">
        <div class="text-5xl mb-4 animate-bounce">🎉</div>
        <h2 class="text-xl font-bold text-slate-200">모든 평가 종료</h2>
        <p class="text-xs text-slate-400 mt-2">감사합니다. 모든 심사 데이터가 본부에 완벽히 집계되었습니다.</p>
      </div>`;
    return;
  }
  const g = ngs[S.bonusGI]; const isMy = S.scorerGroup && !S.scorerGroup.isStaff && S.scorerGroup.id === g.id;
  const exB = S.scores?.[g.id]?.[S.scorerName]?.bonus;
  
  $('vote-banner').innerHTML = `
    <div class="glass p-6 rounded-2xl border border-pink-500/20 text-center relative overflow-hidden bg-gradient-to-r from-pink-950/20 via-black/40 to-pink-950/20">
      <span class="badge badge-bonus mb-2.5">⭐ Q&A BONUS 심사</span>
      <div class="text-2xl font-black text-pink-300">${g.name} 실시간 검증</div>
    </div>`;
    
  if (isMy) { 
    $('vote-body').innerHTML = `
      <div class="glass p-6 rounded-2xl text-center border border-white/5">
        <p class="text-sm text-slate-400">소속 자사 조는 자동으로 보너스 평가 대상에서 보류됩니다.</p>
        <button class="w-full btn btn-primary py-3 mt-4" onclick="bonusNxt()">다음 조 넘어가기 →</button>
      </div>`; 
    return; 
  }
  if (typeof exB === 'number') { 
    $('vote-body').innerHTML = `
      <div class="glass p-6 rounded-2xl text-center border border-white/5">
        <p class="text-sm text-emerald-400 font-bold">✓ 이미 평가 전송 완료 (⭐ ${exB}점)</p>
        <button class="w-full btn btn-primary py-3 mt-4" onclick="bonusNxt()">다음 조 넘어가기 →</button>
      </div>`; 
    return; 
  }
  
  const v = S.bonusScores[g.id] || 0;
  let h = `
    <div class="glass p-6 rounded-2xl border border-pink-500/15">
      <div class="font-extrabold text-base flex items-center gap-1.5 text-slate-100 mb-2"><span>${BONUS.emoji}</span>${BONUS.label}</div>
      <p class="text-xs text-slate-400 leading-relaxed mb-6">${BONUS.desc}</p>
      <div class="grid grid-cols-5 gap-1.5 mb-6">`;
  for (let s = 1; s <= 10; s++) {
    const on = s <= v;
    h += `<button onclick="setBS('${g.id}',${s})" class="mono py-2 rounded-xl border font-bold text-xs transition ${on ? 'border-pink-500 bg-pink-500/10 text-pink-300 font-black' : 'border-white/5 bg-black/40 text-slate-400'}">${s}</button>`;
  }
  h += `</div><div class="flex gap-2">${S.bonusGI > 0 ? '<button class="btn btn-outline py-3 px-5" onclick="bonusPrv()">←</button>':''}<button class="flex-1 btn btn-bonus py-3" onclick="subBonus('${g.id}')" ${!v?'disabled':''}>가산점 전송 & 다음 조 →</button></div></div>`;
  $('vote-body').innerHTML = h;
}

window.goVS = function(i) { if(S.myScores[CATS[i-1]?.id] || i===0 || S.myScores[CATS[i]?.id]) { S.voteStep = i; renderVoteCard(); } }
window.vsNext = function() { if (S.voteStep < CATS.length - 1) { S.voteStep++; renderVoteCard(); } }
window.vsPrev = function() { if (S.voteStep > 0) { S.voteStep--; renderVoteCard(); } }
window.setS = function(id, v) { S.myScores[id] = v; renderVoteCard(); }
window.submitMain = async function() {
  if (!checkFB()) return; const gid = S.config.groups[S.config.currentGroup]?.id; if (!gid) return;
  try {
    await FB.set(FB.ref(db, `sessions/${S.sessionId}/scores/${gid}/${S.scorerName}`), { ...S.myScores, submittedAt: Date.now() });
    S.submitted = true; 
    showToast('💾 본 심사 데이터를 성공적으로 전송했습니다.', 'success');
    renderVote();
  } catch(e) { 
    showToast('제출 실패', 'error'); 
  }
}
window.setBS = function(gid, v) { S.bonusScores[gid] = v; renderBonusVote(); }
window.bonusNxt = function() { S.bonusGI++; renderBonusVote(); }
window.bonusPrv = function() { if (S.bonusGI > 0) S.bonusGI--; renderBonusVote(); }
window.subBonus = async function(gid) {
  if (!checkFB()) return; const v = S.bonusScores[gid]; if (!v) return;
  try {
    await FB.set(FB.ref(db, `sessions/${S.sessionId}/scores/${gid}/${S.scorerName}/bonus`), v);
    S.bonusGI++; 
    showToast('💾 보너스 가산점이 반영되었습니다.', 'success');
    renderBonusVote();
  } catch(e) { 
    showToast('전송 실패', 'error'); 
  }
}

// 📺 LIVE PROJECTOR SCREEN
function loadLive() {
  if (!checkFB()) return; showScreen('screen-live');
  if (S.unsub2) S.unsub2();
  S.unsub2 = FB.onValue(FB.ref(db, `sessions/${S.sessionId}`), (snap) => {
    const d = snap.val(); if (!d) return;
    S.config = d.config; S.scores = d.scores || {}; S.online = d.online || {};
    renderLive();
  });
}

function renderLive() {
  const ranked = getRanked(); const on = Object.keys(S.online);
  const cg = S.config.currentGroup >= 0 ? S.config.groups[S.config.currentGroup] : null;
  
  $('live-header').innerHTML = `
    <div class="flex items-center justify-center gap-3 flex-wrap mb-2">
      <div class="flex items-center gap-1.5 bg-red-500/10 border border-red-500/20 px-3 py-1 rounded-full text-xs font-bold text-red-400">
        <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-ping"></span>
        REALTIME LIVE
      </div>
      <span class="mono text-slate-400 text-sm">세션 코드: <strong class="text-white">${S.sessionId}</strong></span>
      <span class="badge badge-success text-xs font-bold py-1 px-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-300">👥 현재 접속 심사위원: <strong class="text-white font-extrabold">${on.length}</strong>명</span>
    </div>
    ${cg ? `<div class="text-3xl font-extrabold text-white mt-1">🎤 발표 진행 조: <span class="bg-gradient-to-r from-indigo-200 to-indigo-400 bg-clip-text text-transparent underline decoration-indigo-500 decoration-wavy underline-offset-4">${cg.name}</span></div>` : S.config.finished ? '<div class="text-2xl font-black text-emerald-400 mt-1">🏆 본선 발표 심사 공식 마감</div>' : '<div class="text-slate-500 text-sm mt-1">발표 기동 대기 상태</div>'}`;
    
  let html = '';

  // 현재 발표 진행 중일 때, 채점 누락자를 관제하고 통제할 수 있도록 대형 인디케이터 상시 탑재
  if (cg && on.length > 0) {
    const gs = S.scores[cg.id] || {};
    const scored = Object.keys(gs).filter(k => gs[k] && typeof gs[k] === 'object');

    const eligible = on.filter(n => {
      const g2 = findGroup(n);
      return !g2 || g2.isStaff || g2.id !== cg.id;
    });

    const done = eligible.filter(n => scored.includes(n));
    const pending = eligible.filter(n => !scored.includes(n));

    html += `
      <div class="glass p-5 rounded-2xl border border-indigo-500/20 mb-6 bg-indigo-950/5">
        <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
          <span class="text-xs font-bold text-indigo-300 flex items-center gap-1.5">⚡ [${cg.name}] 심사 전송 현황 (${done.length}/${eligible.length} 제출)</span>
          <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">✓ 완료 / … 대기</span>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${done.map(n => `<span class="status-chip done text-xs px-3 py-1.5 border border-emerald-500/10">✓ ${n}</span>`).join('')}
          ${pending.map(n => `<span class="status-chip pending text-xs px-3 py-1.5 border border-amber-500/10">… ${n}</span>`).join('')}
          ${eligible.length === 0 ? '<span class="text-xs text-slate-500 font-medium py-1">평가 가능한 타 조원 심사위원이 아직 접속하지 않았습니다.</span>' : ''}
        </div>
      </div>`;
  }

  if (!ranked.length) { 
    $('live-body').innerHTML = html + '<p class="text-center text-slate-500 py-12">집계 대기 중...</p>'; 
    return; 
  }
  
  const maxT = ranked[0]?.result?.total || 100;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : BC[i % BC.length];
    const pct = maxT > 0 ? ((g.result.total / maxT) * 100).toFixed(0) : 0;
    html += `
      <div class="flex items-center gap-4 mb-3">
        <div class="flex items-center gap-2 w-28 shrink-0">
          <span class="mono text-2xl font-black text-right w-6" style="color:${mc}">${i+1}</span>
          <span class="text-sm font-bold text-slate-200 truncate">${g.name}</span>
        </div>
        <div class="flex-1 height-10 bg-black/40 border border-white/5 rounded-xl overflow-hidden relative h-9 flex items-center">
          <div class="chart-bar h-full rounded-r-lg transition-all duration-500" style="width:${pct}%; background:linear-gradient(90deg, ${mc}40, ${mc})"></div>
          <span class="mono absolute right-4 font-black text-sm text-slate-100">${g.result.total.toFixed(1)} 점</span>
        </div>
      </div>`;
  });
  
  html += `
    <div class="glass p-5 rounded-2xl border border-white/5 overflow-hidden mt-6">
      <h3 class="text-sm font-bold text-indigo-300 mb-4 flex items-center gap-1.5">📊 항목별 심사 상세 대시보드</h3>
      <div class="overflow-x-auto">
        <table>
          <tr>
            <th class="text-left font-bold rounded-l-xl px-4 text-slate-300">대상 팀</th>`;
  CATS.forEach(c => { html += `<th class="font-semibold text-slate-400 text-xs">${c.emoji}<br>${c.w}%</th>`; });
  html += `<th class="text-pink-400 font-bold">⭐ Q&A</th><th class="rounded-r-xl font-bold text-slate-100">총합</th></tr>`;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : 'var(--text-main)';
    html += `<tr class="hover:bg-white/[0.02]"><td class="text-left font-extrabold text-sm px-4">${g.name}</td>`;
    CATS.forEach(c => {
      const v = g.result.avg[c.id] || 0;
      html += `<td class="mono font-bold" style="background:rgba(99,91,255,${((v/10)*0.15).toFixed(2)})">${v.toFixed(1)}</td>`;
    });
    html += `<td class="mono text-pink-400 font-bold">${g.result.bt > 0 ? g.result.bt.toFixed(1) : '-'}</td><td class="mono text-base font-black" style="color:${mc}">${g.result.total.toFixed(1)}</td></tr>`;
  });
  html += `</table></div></div>`;
  $('live-body').innerHTML = html;
}

// 🏆 FINAL DETAILED RESULTS SCREEN
function renderResults() {
  const ranked = getRanked();
  $('results-sub').textContent = `세션코드: ${S.sessionId} | ${ranked.length}개 조 최종 매트릭스 산출`;
  if (!ranked.length) { $('results-body').innerHTML = '<p class="text-slate-500 text-center py-10">데이터가 부재합니다.</p>'; return; }
  
  let html = '';
  if (ranked.length >= 1) {
    html += '<div class="flex items-end justify-center gap-3 my-8 max-w-xl mx-auto min-h-[180px] px-2">';
    const podiumOrder = [1, 0, 2];
    podiumOrder.forEach(pi => {
      const g = ranked[pi]; if (!g) return;
      const isFirst = pi === 0;
      html += `
        <div class="glass p-4 rounded-3xl text-center flex-1 border transition duration-300 ${isFirst ? 'scale-105 border-amber-500/30 bg-gradient-to-t from-amber-500/5 to-transparent glow-indigo' : 'border-white/5 opacity-80'}" style="${isFirst ? 'transform: translateY(-8px);':''}">
          <div class="text-4xl mb-2">${['🥇','🥈','🥉'][pi]}</div>
          <div class="font-extrabold text-sm text-slate-200 truncate">${g.name}</div>
          <div class="text-[10px] text-slate-500 mt-1 truncate">${g.members.join(', ')}</div>
          <div class="mono text-2xl font-black mt-3" style="color:${MC[pi]}">${g.result.total.toFixed(1)}</div>
        </div>`;
    });
    html += '</div>';
  }
  
  html += `
    <div class="glass p-6 rounded-3xl border border-white/5">
      <h3 class="text-sm font-bold text-indigo-300 mb-4 uppercase tracking-wider">📊 리더보드 스코어 레이더</h3>`;
  const mx = ranked[0]?.result?.total || 100;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : BC[i % BC.length];
    html += `
      <div class="flex items-center gap-3 mb-2.5">
        <span class="text-xs font-bold w-12 text-slate-300 shrink-0">${g.name}</span>
        <div class="flex-1 bg-black/40 border border-white/5 rounded-xl h-6 relative overflow-hidden flex items-center">
          <div class="h-full transition-all duration-500" style="width:${mx > 0 ? ((g.result.total / mx) * 100).toFixed(0) : 0}%; background:${mc}"></div>
          <span class="mono absolute right-3 text-[11px] font-black text-slate-100">${g.result.total.toFixed(1)}</span>
        </div>
      </div>`;
  });
  html += `</div>`;
  
  html += `
    <div class="glass p-6 rounded-3xl border border-white/5 overflow-hidden">
      <h3 class="text-sm font-bold text-indigo-300 mb-4 uppercase tracking-wider">🎯 최종 점수 종합 집계표</h3>
      <div class="overflow-x-auto">
        <table>
          <tr>
            <th class="text-left font-bold rounded-l-xl px-4 text-slate-300">순위 / 조 명칭</th>`;
  CATS.forEach(c => { html += `<th class="font-semibold text-slate-400 text-xs">${c.emoji}<br>${c.w}%</th>`; });
  html += `<th class="text-pink-400 font-bold">⭐ Q&A</th><th class="rounded-r-xl font-bold text-slate-100">최종 스코어</th></tr>`;
  ranked.forEach((g, i) => {
    const mc = i < 3 ? MC[i] : 'var(--text-main)';
    html += `<tr><td class="text-left font-extrabold text-sm px-4"><span class="mono mr-1.5" style="color:${mc}">#${i+1}</span>${g.name}</td>`;
    CATS.forEach(c => {
      html += `<td class="mono font-bold text-slate-300">${(g.result.avg[c.id] || 0).toFixed(1)}</td>`;
    });
    html += `<td class="mono text-pink-400 font-bold">${g.result.bt > 0 ? g.result.bt.toFixed(1) : '-'}</td><td class="mono text-base font-black" style="color:${mc}">${g.result.total.toFixed(1)}</td></tr>`;
  });
  html += `</table></div></div>`;
  
  $('results-body').innerHTML = html;
}
